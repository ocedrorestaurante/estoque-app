function scanResultHtml(r){
  if(!r) return '';
  var it = r.id ? state.items[r.id] : null;
  if(r.type === 'added' && it){
    return '<div class="scan-card hit"><div class="item-name">+1 '+esc(it.product)+'</div>' +
      '<div class="row"><span class="mono">total '+fmtQty(r.total)+' '+esc(it.unit||'')+'</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="scan-undo" data-id="'+it.id+'">Desfazer</button></div></div>';
  }
  if(r.type === 'found' && it){
    var d = draftOf(it.sector);
    var v = (isFilled(d[it.id]) && !isNC(d[it.id])) ? String(d[it.id]) : '';
    var last = (it.currentCount === null || it.currentCount === undefined) ? '' : fmtQty(it.currentCount);
    return '<div class="scan-card hit"><div class="item-name">'+esc(it.product)+'</div>' +
      '<div class="item-sub"><span class="tag">'+esc(SECTOR_LABEL[it.sector])+' · '+esc(it.category)+'</span><span class="tag">'+esc(it.unit||'')+'</span>'+(last?'<span class="tag">ant. '+esc(last)+'</span>':'')+'</div>' +
      '<div class="row"><div class="stepper">' +
        '<button data-action="scan-step" data-id="'+it.id+'" data-dir="-1" aria-label="Diminuir">−</button>' +
        '<input id="scan-qty" type="text" inputmode="decimal" data-id="'+it.id+'" value="'+esc(v)+'" placeholder="0" aria-label="Quantidade">' +
        '<button data-action="scan-step" data-id="'+it.id+'" data-dir="1" aria-label="Aumentar">+</button>' +
      '</div><button class="btn btn-primary btn-sm" data-action="scan-qty-done">Anotar</button></div></div>';
  }
  if(r.type === 'other-sector' && it){
    return '<div class="scan-card miss"><b>'+esc(it.product)+'</b> é do setor '+esc(SECTOR_LABEL[it.sector])+'. Este link conta só '+esc(SECTOR_LABEL[state.scopedSector])+'.</div>';
  }
  if(r.type === 'unknown'){
    return '<div class="scan-card miss"><div>O código <span class="mono">'+esc(r.code)+'</span> ainda não está ligado a nenhum produto. Escolha o produto para ligar:</div>' +
      '<div class="search-wrap" style="margin:10px 0 0">'+ICONS.search+'<input type="text" id="link-search" autocomplete="off" placeholder="Buscar produto..." value="'+esc(r.q||'')+'"></div>' +
      '<div class="link-list" id="link-list">'+linkListHtml(r)+'</div></div>';
  }
  return '';
}

function linkListHtml(r){
  var q = (r.q || '').trim().toLowerCase();
  var pool = state.scopedSector ? itemsArray().filter(function(it){ return it.sector === state.scopedSector; }) : itemsArray();
  var list = q ? pool.filter(function(it){ return it.product.toLowerCase().indexOf(q) !== -1; })
               : pool.filter(function(it){ return it.sector === state.sector; });
  list = list.sort(function(a,b){ return a.product.localeCompare(b.product,'pt-BR'); }).slice(0, 30);
  if(!list.length) return '<div style="padding:12px;color:var(--ink-dim);font-size:.85rem">Nenhum produto encontrado. Cadastre no Catálogo e tente de novo.</div>';
  return list.map(function(it){
    return '<button class="link-opt" data-action="link-code" data-id="'+it.id+'" data-code="'+esc(r.code)+'">'+esc(it.product)+'<small>'+esc(SECTOR_LABEL[it.sector])+' · '+esc(it.category)+((it.barcodes&&it.barcodes.length)?' · já tem '+it.barcodes.length+' cód.':'')+'</small></button>';
  }).join('');
}

function updateScanResult(){
  var el = document.getElementById('scan-result');
  if(el && state.modal && state.modal.type === 'scan') el.innerHTML = scanResultHtml(state.modal.result);
}
function scanNote(msg){
  if(state.modal && state.modal.type === 'scan') state.modal.note = msg;
  var n = document.getElementById('scan-note'); if(n){ n.textContent = msg; n.hidden = !msg; }
}
function focusScanInput(){ var si = document.getElementById('scan-input'); if(si && finePointer()) si.focus({preventScroll:true}); }

function handleScan(code){
  code = normCode(code);
  if(!code) return;
  if(!state.modal || state.modal.type !== 'scan') scanOpen();
  var m = state.modal;
  var it = findByCode(code);
  if(!it){ m.result = {type:'unknown', code: code, q: ''}; updateScanResult(); return; }
  if(state.scopedSector && it.sector !== state.scopedSector){ m.result = {type:'other-sector', id: it.id}; updateScanResult(); return; }
  buzz();
  if(m.prev && m.prev.type === 'guided'){
    var idx = m.prev.ids.indexOf(it.id);
    if(idx !== -1){
      stopCamera();
      m.prev.i = idx; state.modal = m.prev;
      render(); renderModal(); focusGuided(); return;
    }
  }
  if(it.sector !== state.sector){ state.sector = it.sector; state.search = ''; }
  var d = draftOf(it.sector);
  if(state.scanAdd){
    var cur = (isFilled(d[it.id]) && !isNC(d[it.id])) ? (num(d[it.id]) || 0) : 0;
    d[it.id] = String(cur + 1);
    m.result = {type:'added', id: it.id, total: cur + 1};
    render(); updateScanResult();
  } else {
    m.result = {type:'found', id: it.id};
    updateScanResult();
    var q = document.getElementById('scan-qty'); if(q && finePointer()) q.focus({preventScroll:true});
  }
}

function scanStep(id, dir){
  var it = state.items[id]; if(!it) return;
  var d = draftOf(it.sector);
  var cur = (isFilled(d[id]) && !isNC(d[id])) ? (num(d[id]) || 0) : ((it.currentCount != null) ? it.currentCount : 0);
  var n = cur + dir; if(n < 0) n = 0;
  d[id] = String(Math.round(n*100)/100);
  var q = document.getElementById('scan-qty'); if(q) q.value = d[id];
}

function scanQtyDone(){
  var m = state.modal; if(!m || !m.result) return;
  var it = state.items[m.result.id];
  m.result = null; render(); updateScanResult();
  if(it) setToast(it.product+' anotado.');
  focusScanInput();
}

function scanUndo(id){
  var it = state.items[id]; if(!it) return;
  var d = draftOf(it.sector);
  var cur = num(d[id]) || 0;
  if(cur <= 1) delete d[id]; else d[id] = String(cur - 1);
  state.modal.result = null; render(); updateScanResult();
  setToast('Leitura desfeita.');
}

async function linkCode(id, code){
  var it = state.items[id]; if(!it || !code) return;
  var codes = (it.barcodes || []).slice();
  if(codes.indexOf(code) === -1) codes.push(code);
  try{
    if(db) await db.doc('items/'+id).update({barcodes: codes});
    it.barcodes = codes;
    setToast('Código ligado a '+it.product+'.');
    handleScan(code);
  }catch(e){ console.error(e); setToast('Não foi possível ligar o código. Tente de novo.'); }
}

function loadScannerLib(){
  return new Promise(function(resolve, reject){
    if(window.Html5Qrcode) return resolve();
    var s = document.createElement('script');
    s.src = SCANNER_SRC; s.onload = function(){ window.Html5Qrcode ? resolve() : reject(new Error('lib')); };
    s.onerror = function(){ reject(new Error('lib')); };
    document.head.appendChild(s);
  });
}

function resetCamButton(){
  var btn = document.getElementById('scan-cam-btn'), box = document.getElementById('scan-camera');
  if(box){ box.hidden = true; box.innerHTML = ''; }
  if(btn){ btn.disabled = false; btn.innerHTML = ICONS.camera+' Usar a câmera do celular'; btn.setAttribute('data-action','scan-camera'); }
}

async function startCamera(){
  var box = document.getElementById('scan-camera'), btn = document.getElementById('scan-cam-btn');
  if(!box || !btn || scanner) return;
  scanNote('');
  box.hidden = false; btn.disabled = true; btn.textContent = 'Abrindo a câmera...';
  try{
    await loadScannerLib();
    if(!document.getElementById('scan-camera')) return;
    scanner = new window.Html5Qrcode('scan-camera', {verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    await scanner.start({facingMode:'environment'}, {
      fps: 10,
      qrbox: function(w, h){ var bw = Math.max(120, Math.floor(w*0.85)); return {width: bw, height: Math.max(80, Math.floor(Math.min(h, w)*0.42))}; }
    }, function(text){
      var now = Date.now();
      if(text === lastCam.code && now - lastCam.t < 1600) return;
      lastCam = {code: text, t: now};
      handleScan(text);
    }, function(){});
    btn.disabled = false; btn.innerHTML = ICONS.close+' Fechar a câmera'; btn.setAttribute('data-action','scan-camera-stop');
  }catch(err){
    console.error(err);
    stopCamera(); resetCamButton();
    scanNote('A câmera não abriu aqui. Use o coletor ou digite o código no campo abaixo.');
  }
}

function stopCamera(){
  if(!scanner) return;
  var s = scanner; scanner = null;
  try{ s.stop().then(function(){ try{ s.clear(); }catch(e){} }).catch(function(){}); }catch(e){}
}

// Coletor em modo teclado: bipes fora de um campo de texto abrem a leitura sozinhos
var wedge = {buf:'', t:0};
document.addEventListener('keydown', function(e){
  var id = e.target && e.target.id;
  if(id === 'scan-input' && e.key === 'Enter'){ e.preventDefault(); var v = e.target.value; e.target.value = ''; wedge.buf = ''; handleScan(v); return; }
  if(id === 'scan-qty' && e.key === 'Enter'){ e.preventDefault(); scanQtyDone(); return; }
  var now = Date.now();
  if(e.key === 'Enter'){
    var isWedge = wedge.buf.length >= 4 && now - wedge.t < 150;
    var code = wedge.buf; wedge.buf = '';
    if(id === 'g-input'){
      e.preventDefault();
      if(isWedge){
        var inp = e.target;
        if(inp.value.slice(-code.length) === code){ inp.value = inp.value.slice(0, -code.length); guidedInput(inp.value); }
        handleScan(code);
      } else guidedMove(1);
      return;
    }
    var tag = e.target && e.target.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if(state.tab !== 'count' || (state.modal && state.modal.type !== 'guided')) return;
    if(isWedge){ e.preventDefault(); handleScan(code); }
    return;
  }
  if(e.key && e.key.length === 1){
    if(now - wedge.t > 80) wedge.buf = '';
    wedge.buf += e.key; wedge.t = now;
  }
});

function routeOpen(){

  g.order.forEach(function(c){ items[c] = g.groups[c].map(function(it){ return it.id; }); });
  state.modal = {type:'route', sector: sector, cats: g.order.slice(), items: items, open: {}};
  renderModal();
}

function modalRoute(m){

    var ids = m.items[c] || [];

        '<div class="route-moves">' +
          '<button class="icon-btn" data-action="route-move" data-kind="cat" data-idx="'+ci+'" data-dir="-1"'+(ci===0?' disabled':'')+' aria-label="Subir">'+ICONS.up+'</button>' +
          '<button class="icon-btn" data-action="route-move" data-kind="cat" data-idx="'+ci+'" data-dir="1"'+(ci===m.cats.length-1?' disabled':'')+' aria-label="Descer">'+ICONS.down+'</button>' +

    '</div>';
  }).join('');
  return '' +

    '<div class="sheet-head"><h2>Rota de '+esc(SECTOR_LABEL[m.sector])+'</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar">'+ICONS.close+'</button></div>' +
    '<p class="section-intro">Coloque os grupos e os produtos na ordem em que você anda pelo estoque. A contagem guiada e a lista seguem essa ordem.</p>' +

    '<div class="modal-actions" style="margin-top:12px">' +
      '<button class="btn btn-ghost" data-action="close-modal">Cancelar</button>' +
      '<button class="btn btn-primary" data-action="route-save">Salvar rota</button>' +
    '</div>' +
  '</div>';
}

function renderRouteKeepScroll(){
  var sc = document.getElementById('route-scroll');
  var top = sc ? sc.scrollTop : 0;
  renderModal();
  var sc2 = document.getElementById('route-scroll'); if(sc2) sc2.scrollTop = top;
}

function routeMove(el){
  var m = state.modal; if(!m) return;
  var dir = parseInt(el.getAttribute('data-dir'), 10), idx = parseInt(el.getAttribute('data-idx'), 10);
  var arr = el.getAttribute('data-kind') === 'cat' ? m.cats : m.items[el.getAttribute('data-cat')];
  var j = idx + dir;
  if(!arr || j < 0 || j >= arr.length) return;
  var tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
  renderRouteKeepScroll();
}

async function routeSave(){
  var m = state.modal; if(!m) return;
  var routes = Object.assign({}, state.routes || {});
  routes[m.sector] = m.cats.slice();
  var ops = [];
  m.cats.forEach(function(c){
    (m.items[c] || []).forEach(function(id, i){
      var it = state.items[id];
      if(it && it.order !== i + 1) ops.push({id: id, order: i + 1});
    });
  });
  try{
    if(db){
      await db.doc('meta/routes').set(routes);
      var batches = chunk(ops, 15);
      for(var b=0;b<batches.length;b++){
        await Promise.all(batches[b].map(function(op){ return db.doc('items/'+op.id).update({order: op.order}); }));
      }
    }
    state.routes = routes;
    ops.forEach(function(op){ if(state.items[op.id]) state.items[op.id].order = op.order; });
    state.modal = null; render(); renderModal();
    setToast('Rota salva.');
  }catch(e){ console.error(e); setToast('Não foi possível salvar a rota. Tente de novo.'); }
}

async function finalizeCount(force){
  if(isEquipe() && !String(state.responsavel||'').trim()){ setToast('Escreva seu nome em Responsável antes de finalizar.'); var ri = document.getElementById('responsavel-input'); if(ri) ri.focus(); return; }
  var sector = state.sector;
  var draft = draftOf(sector);
  var blanks = sectorBlankItems(sector);
  if(blanks.length && !force){
    state.modal = {type:'finalize-check', sector: sector, ids: blanks.map(function(it){ return it.id; })};
    renderModal(); return;
  }
  var counts = {}, skipped = [];
  countItems(sector).forEach(function(it){
    var v = draft[it.id];
    if(isNC(v) || !isFilled(v)){ skipped.push(it.id); return; }
    var n = num(v);
    if(n === null) skipped.push(it.id); else counts[it.id] = n;
  });
  if(!Object.keys(counts).length){ setToast('Conte pelo menos um item antes de finalizar.'); return; }
  var createdAt = new Date().toISOString();
  var sessionData = {
    sector: sector, kind: state.countKind, createdAt: createdAt, date: todayISO(),
    responsavel: state.responsavel || null, counts: counts, skipped: skipped
  };
  try{
    if(db){
      var ref = await db.collection('sessions').add(sessionData);
      sessionData.id = ref.id;
      var ops = Object.keys(counts).map(function(id){ return {id:id, data:{currentCount: counts[id], lastCountedAt: createdAt, lastSessionId: ref.id}}; })
        .concat(skipped.map(function(id){ return {id:id, data:{lastSkippedAt: createdAt}}; }));
      var batches = chunk(ops, 15);
      for(var i=0;i<batches.length;i++){
        await Promise.all(batches[i].map(function(op){ return db.doc('items/'+op.id).update(op.data); }));
      }
      pruneSessions();
    } else {
      Object.keys(counts).forEach(function(id){ if(state.items[id]){ state.items[id].currentCount = counts[id]; state.items[id].lastCountedAt = createdAt; } });
      skipped.forEach(function(id){ if(state.items[id]) state.items[id].lastSkippedAt = createdAt; });
    }
    state.draft[sector] = {};
    state.modal = {type:'share', session: sessionData, justSaved: true};
    setToast('Contagem de '+SECTOR_LABEL[sector]+' salva'+(skipped.length ? ' · '+skipped.length+' não contados' : '')+'.');
    render(); renderModal();
  }catch(e){ console.error(e); setToast('Não foi possível salvar agora. Tente novamente.'); }
}

async function saveItemForm(form){
  var fd = new FormData(form);
  var id = form.getAttribute('data-id');
  var sector = fd.get('sector');
  var category = fd.get('category');
  if(category === '__new__'){ category = (fd.get('categoryNew')||'').trim() || 'Outros'; }
  var data = {
    product: (fd.get('product')||'').trim(),
    sector: sector,
    category: category,
    unit: fd.get('unit'),
    minStock: num(fd.get('minStock')),
    supplierId: fd.get('supplierId') || null,
    supplierName: fd.get('supplierId') ? (state.suppliers[fd.get('supplierId')]||{}).name : null,
    notes: (fd.get('notes')||'').trim() || null,
    daily: fd.get('daily') === 'on',
    barcodes: (fd.get('barcodes')||'').split(/[,;\n]/).map(normCode).filter(function(c, i, a){ return c && a.indexOf(c) === i; })
  };
  if(!data.product) return;
  try{
    if(id){
      if(db) await db.doc('items/'+id).update(data);
      else Object.assign(state.items[id], data);
    } else {
      var newId = slugify(sector+'-'+category+'-'+data.product) + '-' + Math.random().toString(36).slice(2,6);
      data.order = 9999; data.currentCount = null; data.lastCountedAt = null; data.lastSessionId = null; data.createdAt = new Date().toISOString();
      if(db) await db.doc('items/'+newId).set(data);
      else state.items[newId] = Object.assign({id:newId}, data);
    }
    state.modal = null; setToast('Item salvo.'); render();
  }catch(e){ console.error(e); setToast('Erro ao salvar item.'); }
}

async function saveSupplierForm(form){

// ================= EVENTS =================
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(el){
    var action = el.getAttribute('data-action');
    if(action==='tab'){ if(state.scopedSector) return; var nt = el.getAttribute('data-tab'); if(isEquipe() && !EQUIPE_TABS[nt]) return; state.tab = nt; render(); return; }
    if(action==='set-sector'){ if(state.scopedSector || lockedSector()) return; state.sector = el.getAttribute('data-sector'); state.search=''; render(); return; }
    if(action==='toggle-category'){
      var cat = el.getAttribute('data-cat');
      state.collapsed[state.sector][cat] = !state.collapsed[state.sector][cat];
      render(); return;
    }
    if(action==='step'){
      var id = el.getAttribute('data-id'), dir = parseFloat(el.getAttribute('data-dir'));
      var it = state.items[id];
      var cur = state.draft[state.sector][id];
      if(!isFilled(cur) || isNC(cur)) cur = (it&&it.currentCount!=null) ? it.currentCount : 0;
      var n = (num(cur)||0) + dir;
      if(n < 0) n = 0;
      state.draft[state.sector][id] = String(n);
      render(); return;
    }
    if(action==='finalize'){ finalizeCount(false); return; }
    if(action==='finalize-force'){ finalizeCount(true); return; }
    if(action==='logout'){ if(sb) sb.auth.signOut(); return; }
    if(action==='set-kind'){ state.countKind = el.getAttribute('data-kind'); try{ localStorage.setItem('cedro_kind', state.countKind); }catch(e){} render(); return; }
    if(action==='daily-open'){ dailyOpen(); return; }
    if(action==='daily-save'){ dailySave(); return; }
    if(action==='daily-cat'){ dailyToggleCat(el.getAttribute('data-cat')); return; }
    if(action==='secitems-open'){ if(!isAdmin()) return; secItemsOpen(); return; }
    if(action==='secitems-cat'){ secItemsToggleCat(el.getAttribute('data-key')); return; }
    if(action==='secitems-save'){ secItemsSave(); return; }
    if(action==='share-open'){ var ss = state.sessions.filter(function(x){ return String(x.id) === el.getAttribute('data-id'); })[0]; if(ss){ state.modal = {type:'share', session: ss}; renderModal(); } return; }
    if(action==='share-pdf'){ sharePdf(state.modal.session); return; }
    if(action==='share-download'){ downloadPdf(state.modal.session); return; }
    if(action==='share-wa'){ openWhats(el.getAttribute('data-num'), state.modal.session); return; }
    if(action==='share-edit'){ state.modal.editing = !state.modal.editing; renderModal(); return; }
    if(action==='share-save-nums'){ saveShareNumbers(); return; }
    if(action==='nc-toggle'){ var nid = el.getAttribute('data-id'); var nit = state.items[nid]; if(!nit) return; var nd = draftOf(nit.sector); if(isNC(nd[nid])) delete nd[nid]; else nd[nid] = NC; render(); return; }
    if(action==='guided-start'){ guidedStart(el.getAttribute('data-remaining')==='1'); return; }
    if(action==='g-step'){ guidedStep(parseFloat(el.getAttribute('data-dir'))); return; }
    if(action==='g-next'){ guidedMove(1); return; }
    if(action==='g-prev'){ guidedMove(-1); return; }
    if(action==='g-nc'){ guidedToggleNC(); return; }
    if(action==='scan-open'){ scanOpen(); return; }
    if(action==='scan-camera'){ startCamera(); return; }
    if(action==='scan-camera-stop'){ stopCamera(); resetCamButton(); return; }
    if(action==='scan-qty-done'){ scanQtyDone(); return; }
    if(action==='scan-undo'){ scanUndo(el.getAttribute('data-id')); return; }
    if(action==='scan-step'){ scanStep(el.getAttribute('data-id'), parseFloat(el.getAttribute('data-dir'))); return; }
    if(action==='link-code'){ linkCode(el.getAttribute('data-id'), el.getAttribute('data-code')); return; }
    if(action==='route-open'){ routeOpen(); return; }
    if(action==='route-expand'){ var rc = el.getAttribute('data-cat'); state.modal.open[rc] = !state.modal.open[rc]; renderRouteKeepScroll(); return; }
    if(action==='route-move'){ routeMove(el); return; }
    if(action==='route-save'){ routeSave(); return; }
    if(action==='extra-open'){ state.modal = {type:'extra-req'}; renderModal(); var et = document.getElementById('extra-text'); if(et) et.focus(); return; }
    if(action==='extra-done'){ if(!isEquipe()) setExtraStatus(el.getAttribute('data-id'), true); return; }
    if(action==='extra-undo'){ if(!isEquipe()) setExtraStatus(el.getAttribute('data-id'), false); return; }
    if(action==='extra-del'){ if(!isEquipe()){ state.modal = {type:'extra-del', id: el.getAttribute('data-id')}; renderModal(); } return; }
    if(action==='extra-del-confirm'){ if(!isEquipe()) deleteExtra(el.getAttribute('data-id')); return; }
    if(action==='extra-catalog'){ var ex = state.extras.filter(function(x){ return x.id === el.getAttribute('data-id'); })[0]; if(ex && !isEquipe()){ state.modal = {type:'item-form', id:null, prefill: ex.texto}; renderModal(); setToast('Ajuste nome, setor e fornecedor. O pedido continua em aberto.'); } return; }
    if(action==='show-note'){ state.modal = {type:'note', id: el.getAttribute('data-id')}; renderModal(); return; }
    if(action==='close-modal'){
      if(el.classList.contains('modal-backdrop') && e.target !== el) return;
      closeModal(); return;
    }
    if(action==='catalog-seg'){ state.catalogSeg = el.getAttribute('data-seg'); if(state.catalogSeg === 'acessos') state.postos = null; render(); return; }
    if(action==='posto-pass'){ if(!isAdmin()) return; state.modal = {type:'posto-pass', posto: el.getAttribute('data-posto')}; renderModal(); var pi = document.getElementById('posto-pass-input'); if(pi) pi.focus(); return; }
    if(action==='open-item-form'){ state.modal = {type:'item-form', id: el.getAttribute('data-id')||null}; renderModal(); return; }
    if(action==='open-supplier-form'){ state.modal = {type:'supplier-form', id: el.getAttribute('data-id')||null}; renderModal(); return; }
    if(action==='delete-item'){ state.modal = {type:'confirm-delete', kind:'item', id: el.getAttribute('data-id')}; renderModal(); return; }
    if(action==='delete-supplier'){ state.modal = {type:'confirm-delete', kind:'supplier', id: el.getAttribute('data-id')}; renderModal(); return; }
    if(action==='confirm-delete'){ deleteEntity(el.getAttribute('data-kind'), el.getAttribute('data-id')); return; }
    if(action==='toggle-history'){ var sid = el.getAttribute('data-id'); state.historyOpen[sid] = !state.historyOpen[sid]; render(); return; }
    if(action==='toggle-order-group'){
      var gk = el.getAttribute('data-key'); if(!state.ordersOpen) state.ordersOpen = {};
      var gcard = el.closest('.po-group'); var isOpen = gcard && gcard.classList.contains('open');
      state.ordersOpen[gk] = !isOpen; if(gcard) gcard.classList.toggle('open', !isOpen); return;
    }
    if(action==='clear-order'){
      var ck = el.getAttribute('data-key'); var cg = computeOrderList().filter(function(g){ return g.key===ck; })[0];
      if(cg){ cg.items.forEach(function(it){ delete state.orderQty[it.id]; }); saveOrderQty(); render(); }
      return;
    }
    if(action==='copy-order'){
      var ok = el.getAttribute('data-key'); var og = computeOrderList().filter(function(g){ return g.key===ok; })[0];
      var msg = og ? buildOrderMessage(og.supplier, og.items) : '';
      if(!msg){ setToast('Nada para pedir: preencha a coluna Pedido.'); return; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(msg).then(function(){ setToast('Mensagem copiada!'); }).catch(function(){ setToast('Não foi possível copiar.'); });
      } else { setToast('Cópia não suportada neste navegador.'); }
      return;
    }
  } else if(e.target.classList && e.target.classList.contains('modal-backdrop')){
    closeModal();
  }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'g-input'){ guidedInput(e.target.value); return; }
  if(e.target.id === 'sec-search' && state.modal && state.modal.type === 'secitems'){ state.modal.q = e.target.value; secItemsFilter(); return; }
  if(e.target.matches && e.target.matches('[data-action="order-qty"]')){ loadOrderQty(); var oid = e.target.getAttribute('data-id'); if(e.target.value.trim()===''){ delete state.orderQty[oid]; } else { state.orderQty[oid] = e.target.value; } saveOrderQty(); return; }
  if(e.target.id === 'scan-qty'){ var qid = e.target.getAttribute('data-id'); var qit = state.items[qid]; if(qit){ draftOf(qit.sector)[qid] = e.target.value; } return; }
  if(e.target.id === 'link-search'){ if(state.modal && state.modal.result){ state.modal.result.q = e.target.value; var ll = document.getElementById('link-list'); if(ll) ll.innerHTML = linkListHtml(state.modal.result); } return; }
  if(e.target.matches('[data-action="qty-input"]')){

  } else if(e.target.id === 'responsavel-input'){
    state.responsavel = e.target.value;
    try{ localStorage.setItem('cedro_responsavel', state.responsavel); }catch(err){}
  }
});

// ================= ETIQUETAS DE VALIDADE =================
var LBL_TYPES = ['Congelado','Refrigerado','Temperatura Ambiente'];
var LBL_TAG = {'Congelado':'CONG.','Refrigerado':'REFRIG.','Temperatura Ambiente':'AMB.'};

function lblIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lblToday(){ return lblIso(new Date()); }
function lblParse(iso){ var p = String(iso).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function lblAddDays(iso, n){ var d = lblParse(iso); d.setDate(d.getDate() + Number(n)); return lblIso(d); }
function lblDiff(fromIso, toIso){ return Math.round((lblParse(toIso) - lblParse(fromIso)) / 86400000); }
function lblStatus(val){ var d = lblDiff(lblToday(), val); return d < 0 ? 'danger' : (d <= 1 ? 'warn' : 'ok'); }
function lblStatusText(val){
  var d = lblDiff(lblToday(), val);
  if(d < 0) return 'Vencido há ' + Math.abs(d) + (Math.abs(d) === 1 ? ' dia' : ' dias');
  if(d === 0) return 'Vence hoje';
  if(d === 1) return 'Vence amanhã';
  return 'Vence em ' + d + ' dias';
}
function lblCfg(){
  var c = state.labelCfg || {};
  var w = Number(c.width) > 0 ? Number(c.width) : 60, h = Number(c.height) > 0 ? Number(c.height) : 60;
  return {width:w, height:h};
}
function lblStationLoad(){ try{ return localStorage.getItem('lblStation') === '1'; }catch(e){ return false; } }
function lblStationSave(on){ try{ localStorage.setItem('lblStation', on ? '1' : '0'); }catch(e){} }
function lblStationOnline(){
  var at = state.labelStationAt; if(!at) return false;
  return (Date.now() - new Date(at).getTime()) < 60000;
}
function lblPending(){
  return Object.keys(state.labelQueue).map(function(k){ return state.labelQueue[k]; })
    .filter(function(j){ return j.status === 'pending'; })
    .sort(function(a,b){ return String(a.createdAt||'').localeCompare(String(b.createdAt||'')); });
}
function lblProducts(){
  return Object.keys(state.labelProducts).map(function(k){ return state.labelProducts[k]; })
    .sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','pt-BR'); });
}
function lblRulesOf(pid){
  return Object.keys(state.labelRules).map(function(k){ return state.labelRules[k]; })
    .filter(function(r){ return r.productId === pid; })
    .sort(function(a,b){ return LBL_TYPES.indexOf(a.storageType) - LBL_TYPES.indexOf(b.storageType); });
}
function lblItems(){
  return Object.keys(state.labelItems).map(function(k){ return state.labelItems[k]; })
    .sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
}
function lblText(it){
  return it.productName + ' - ' + (LBL_TAG[it.storageType] || '') + '\nFab.: ' + formatDateBR(it.madeDate) +
    '\nVal.: ' + formatDateBR(it.validade) + (it.weight ? '\nPeso: ' + it.weight : '');
}
// Etiquetas: guardadas na tabela label_docs do Supabase (coll + id + data)
var LBL_COLLS = ['labelProducts','labelRules','labelItems','labelQueue'];
function lblWrite(coll, id, data){
  if(db && sb){
    if(state[coll] && typeof state[coll] === 'object' && LBL_COLLS.indexOf(coll) >= 0){ state[coll][id] = Object.assign({id:id}, data); }
    return sb.from('label_docs').upsert({coll:coll, id:id, data:data, updated_at:new Date().toISOString()})
      .then(function(res){ if(res.error) throw res.error; scheduleReload('label_docs'); })
      .catch(function(e){ console.error(e); setToast('Não foi possível salvar.'); });
  }
  state[coll][id] = Object.assign({id:id}, data); render(); return Promise.resolve();
}
function lblRemove(coll, id){
  if(db && sb){
    if(state[coll] && LBL_COLLS.indexOf(coll) >= 0) delete state[coll][id];
    return sb.from('label_docs').delete().eq('coll', coll).eq('id', id)
      .then(function(res){ if(res.error) throw res.error; scheduleReload('label_docs'); })
      .catch(function(e){ console.error(e); setToast('Não foi possível excluir.'); });
  }
  delete state[coll][id]; render(); return Promise.resolve();
}
async function loadLabelDocs(){
  var rows = check(await sb.from('label_docs').select('coll,id,data').limit(5000));
  var out = {labelProducts:{}, labelRules:{}, labelItems:{}, labelQueue:{}};
  var cfg = null, stationAt = '';
  rows.forEach(function(r){
    if(out[r.coll]) out[r.coll][r.id] = Object.assign({id:r.id}, r.data || {});
    else if(r.coll === 'labelConfig' && r.id === 'main') cfg = r.data;
    else if(r.coll === 'labelConfig' && r.id === 'station') stationAt = (r.data && r.data.at) || '';
  });
  LBL_COLLS.forEach(function(c){ state[c] = out[c]; });
  if(cfg) state.labelCfg = cfg;
  state.labelStationAt = stationAt;
  setTimeout(lblProcessQueue, 0);
}
function renderLabels(){
  var segs = isEquipe() ? [['gerar','Gerar']] : [['gerar','Gerar'],['produtos','Produtos'],['validade','Validades'],['impressao','Impressão']];
  if(isEquipe()) state.lblSeg = 'gerar';
  var seg = '<div class="segmented">' + segs.map(function(s){
    return '<button class="'+(state.lblSeg===s[0]?'active':'')+'" data-action="lbl-seg" data-seg="'+s[0]+'">'+s[1]+'</button>';
  }).join('') + '</div>';
  if(state.lblSeg === 'produtos') return seg + renderLblProducts();
  if(state.lblSeg === 'validade') return seg + renderLblRules();
  if(state.lblSeg === 'impressao') return seg + renderLblPrinting();
  return seg + renderLblGenerate();
}

function renderLblGenerate(){
  var prods = lblProducts();
  var f = state.lbl;
  if(!prods.some(function(p){ return p.id === f.productId; })) f.productId = prods[0] ? prods[0].id : '';
  var rules = lblRulesOf(f.productId);
  if(!rules.some(function(r){ return r.storageType === f.storageType; })) f.storageType = rules[0] ? rules[0].storageType : '';
  if(!f.date) f.date = lblToday();
  var rule = rules.filter(function(r){ return r.storageType === f.storageType; })[0];

  var preview = '';
  if(rule){ preview = 'Validade: <b>' + formatDateBR(lblAddDays(f.date, rule.days)) + '</b> (' + rule.days + (Number(rule.days) === 1 ? ' dia' : ' dias') + ')'; }
  else if(f.productId){ preview = 'Este produto ainda não tem validade. Cadastre na aba Validades.'; }

  var prodOpts = prods.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===f.productId?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('');
  var typeOpts = rules.map(function(r){
    return '<option value="'+esc(r.storageType)+'"'+(r.storageType===f.storageType?' selected':'')+'>'+esc(r.storageType)+' · '+r.days+(Number(r.days)===1?' dia':' dias')+'</option>';
  }).join('');

  var form;
  if(!prods.length){
    form = '<div class="empty-state">'+ICONS.labels+'<div>Cadastre os produtos na aba Produtos para gerar etiquetas.</div></div>';
  } else {
    form = '' +
    '<div class="card lbl-form">' +
      '<div class="field"><label for="lbl-prod">Produto</label><select id="lbl-prod">'+prodOpts+'</select></div>' +
      '<div class="field"><label for="lbl-type">Armazenamento</label><select id="lbl-type"'+(rules.length?'':' disabled')+'>'+(typeOpts || '<option>Nenhum cadastrado</option>')+'</select></div>' +
      '<div class="lbl-three">' +
        '<div class="field"><label for="lbl-date">Fabricação</label><input type="date" id="lbl-date" value="'+esc(f.date)+'"></div>' +
        '<div class="field"><label for="lbl-weight">Peso (opcional)</label><input type="text" id="lbl-weight" placeholder="ex.: 500g" value="'+esc(f.weight)+'"></div>' +
        '<div class="field qty"><label for="lbl-copies">Qtd.</label><input type="number" inputmode="numeric" min="1" max="50" step="1" id="lbl-copies" value="'+esc(f.copies)+'"></div>' +
      '</div>' +
      '<div class="lbl-preview">'+preview+'</div>' +
      '<button class="btn btn-primary btn-block" data-action="lbl-generate-print"'+(rule?'':' disabled')+'>'+ICONS.labels+' Gerar e imprimir</button>' +
      '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="lbl-generate"'+(rule?'':' disabled')+'>Só gerar (sem imprimir)</button>' +
      '<div class="lbl-station '+(state.lblStation?'on':(lblStationOnline()?'on':'off'))+'">'+lblStationText()+'</div>' +
    '</div>';
  }

  var items = lblItems();
  var list = items.length ? items.map(function(it){
    var st = lblStatus(it.validade);
    return '' +
    '<div class="lbl-row '+st+'">' +
      '<div class="lbl-main">' +
        '<div class="lbl-name">'+esc(it.productName)+' <span class="tag">'+esc(LBL_TAG[it.storageType]||'')+'</span></div>' +
        '<div class="lbl-meta">Fab. '+formatDateBR(it.madeDate)+' · Val. '+formatDateBR(it.validade)+(it.weight?' · '+esc(it.weight):'')+'</div>' +
      '</div>' +
      '<span class="lbl-pill '+st+'">'+lblStatusText(it.validade)+'</span>' +
      '<div class="row-actions">' +
        '<button class="icon-btn" data-action="lbl-copy" data-id="'+esc(it.id)+'" aria-label="Copiar texto">'+ICONS.copy+'</button>' +
        '<button class="btn btn-primary btn-sm" data-action="lbl-print" data-id="'+esc(it.id)+'">Imprimir</button>' +
        '<button class="icon-btn" data-action="lbl-del" data-id="'+esc(it.id)+'" aria-label="Excluir etiqueta">'+ICONS.trash+'</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-state">'+ICONS.labels+'<div>Nenhuma etiqueta gerada ainda.</div></div>';

  return form + '<div class="lbl-list"><h3 style="margin:18px 0 10px;font-size:1rem;">Etiquetas geradas <span class="mono" style="font-size:.78rem;color:var(--ink-dim);">('+items.length+')</span></h3>' + list + '</div>';
}

function renderLblProducts(){
  var prods = lblProducts();
  var add = '' +
  '<div class="card lbl-form">' +
    '<div class="field"><label for="lbl-newprod">Novo produto</label><input type="text" id="lbl-newprod" placeholder="ex.: Molho de tomate" value="'+esc(state.lblNewProd)+'"></div>' +
    '<button class="btn btn-primary btn-block" data-action="lbl-prod-add">'+ICONS.plus+' Adicionar produto</button>' +

        '<button class="btn btn-danger btn-sm" data-action="lbl-prod-del-yes" data-id="'+esc(p.id)+'">Excluir</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="lbl-cancel">Cancelar</button></div>' : '';
    return '' +
    '<div class="lbl-row" style="flex-wrap:wrap;">' +
      '<div class="lbl-main"><div class="lbl-name">'+esc(p.name)+'</div>' +
      '<div class="lbl-meta">'+n+(n===1?' validade cadastrada':' validades cadastradas')+'</div></div>' +
      '<div class="row-actions"><button class="icon-btn" data-action="lbl-prod-del" data-id="'+esc(p.id)+'" aria-label="Excluir produto">'+ICONS.trash+'</button></div>' +

function renderLblRules(){
  var prods = lblProducts();
  var r = state.lblRule;
  if(!prods.some(function(p){ return p.id === r.productId; })) r.productId = prods[0] ? prods[0].id : '';
  var prodOpts = prods.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===r.productId?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('');
  var typeOpts = LBL_TYPES.map(function(t){ return '<option value="'+esc(t)+'"'+(t===r.storageType?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  var form = prods.length ? '' +
  '<div class="card lbl-form">' +
    '<p class="lbl-hint">Diga quantos dias o produto dura em cada tipo de armazenamento. Se já existir, o número é atualizado.</p>' +
    '<div class="field"><label for="lbl-rprod">Produto</label><select id="lbl-rprod">'+prodOpts+'</select></div>' +
    '<div class="two-col">' +
      '<div class="field"><label for="lbl-rtype">Armazenamento</label><select id="lbl-rtype">'+typeOpts+'</select></div>' +
      '<div class="field"><label for="lbl-rdays">Dias de validade</label><input type="number" inputmode="numeric" min="1" step="1" id="lbl-rdays" placeholder="ex.: 3" value="'+esc(r.days)+'"></div>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" data-action="lbl-rule-add">'+ICONS.plus+' Salvar validade</button>' +
  '</div>' : '<div class="empty-state">'+ICONS.labels+'<div>Cadastre um produto primeiro, na aba Produtos.</div></div>';

  var groups = prods.map(function(p){
    var rules = lblRulesOf(p.id);
    var lines = rules.length ? rules.map(function(x){
      return '<div class="lbl-rule-line"><span>'+esc(x.storageType)+'</span><span class="d">'+x.days+(Number(x.days)===1?' dia':' dias')+'</span>' +
        '<button class="icon-btn" data-action="lbl-rule-del" data-id="'+esc(x.id)+'" aria-label="Excluir validade">'+ICONS.trash+'</button></div>';
    }).join('') : '<div class="lbl-hint" style="margin:6px 0 0;">Nenhuma validade cadastrada.</div>';
    return '<div class="card lbl-rules-group" style="padding:12px 14px;"><div class="lbl-name">'+esc(p.name)+'</div>'+lines+'</div>';
  }).join('');
  return form + '<div class="lbl-list" style="margin-top:14px;">' + groups + '</div>';
}

function lblGenerate(doPrint){
  var f = state.lbl, p = state.labelProducts[f.productId];
  var rule = lblRulesOf(f.productId).filter(function(r){ return r.storageType === f.storageType; })[0];
  if(!p || !rule || !f.date) return;
  var data = {
    productId:p.id, productName:p.name, storageType:rule.storageType, days:Number(rule.days),
    weight:(f.weight||'').trim(), madeDate:f.date, validade:lblAddDays(f.date, rule.days), createdAt:new Date().toISOString()
  };
  var copies = Math.max(1, Math.min(50, parseInt(f.copies, 10) || 1));
  var newId = uid('lbl');
  f.weight = '';
  lblWrite('labelItems', newId, data).then(function(){ if(!doPrint) setToast('Etiqueta gerada.'); });
  if(doPrint) lblSend(Object.assign({id:newId}, data), copies);
  if(db) render();
  var arr = lblItems();
  if(arr.length > 150){ arr.slice(150).forEach(function(x){ lblRemove('labelItems', x.id); }); }
}
function lblAddProduct(){
  var name = (state.lblNewProd || '').trim();
  if(!name) return;
  state.lblNewProd = '';
  lblWrite('labelProducts', slugify(name), {name:name}).then(function(){ setToast('Produto adicionado.'); });
  if(db) render();
}
function lblAddRule(){
  var r = state.lblRule, p = state.labelProducts[r.productId];
  var days = parseInt(String(r.days).replace(',', '.'), 10);
  if(!p){ setToast('Escolha um produto.'); return; }
  if(!days || days < 1){ setToast('Informe os dias de validade.'); return; }
  state.lblRule.days = '';
  lblWrite('labelRules', p.id + '__' + slugify(r.storageType), {productId:p.id, productName:p.name, storageType:r.storageType, days:days})
    .then(function(){ setToast('Validade salva.'); });
  if(db) render();
}
function lblDeleteProduct(id){
  state.lblConfirm = null;
  lblRulesOf(id).forEach(function(r){ lblRemove('labelRules', r.id); });
  lblRemove('labelProducts', id).then(function(){ setToast('Produto excluído.'); });
  if(db) render();
}
function lblStationText(){
  var n = lblPending().length;
  var q = n ? ' · ' + n + (n === 1 ? ' etiqueta na fila' : ' etiquetas na fila') : '';
  if(state.lblStation) return 'Este aparelho é a estação de impressão' + q;
  if(!db) return 'Impressão neste aparelho (sem sincronização)';
  return lblStationOnline() ? 'Impressora conectada' + q : 'Estação de impressão offline: abra o app no computador da impressora' + q;
}
function lblLabelHtml(it, cfg){
  var s = Math.min(cfg.width, cfg.height) / 60;
  var base = Math.max(6, 10 * s);
  var pad = Math.max(1.5, 3.5 * s);
  return '<div class="pl-page" style="width:'+cfg.width+'mm;height:'+cfg.height+'mm;padding:'+pad+'mm;font-size:'+base.toFixed(1)+'pt;">' +
    '<div class="pl-name">'+esc(it.productName)+'</div>' +
    '<div class="pl-tag">'+esc(it.storageType||'')+'</div>' +
    '<div class="pl-line"><span>Fab.</span> <b>'+formatDateBR(it.madeDate)+'</b></div>' +
    '<div class="pl-val"><span>Val.</span> '+formatDateBR(it.validade)+'</div>' +
    (it.weight ? '<div class="pl-line"><span>Peso</span> <b>'+esc(it.weight)+'</b></div>' : '') +
    '<div class="pl-foot">O CEDRO</div>' +
  '</div>';
}
var lblPrinting = false;
function lblPrint(it, copies, cb){
  if(lblPrinting){ setTimeout(function(){ lblPrint(it, copies, cb); }, 700); return; }
  lblPrinting = true;
  var cfg = lblCfg(), n = Math.max(1, Math.min(50, parseInt(copies, 10) || 1));
  var box = document.getElementById('print-label'), html = '';
  for(var k = 0; k < n; k++) html += lblLabelHtml(it, cfg);
  box.innerHTML = html;
  var st = document.createElement('style');
  st.textContent = '@page{size:'+cfg.width+'mm '+cfg.height+'mm;margin:0;}';
  document.head.appendChild(st);
  document.body.classList.add('printing-label');
  var finished = false;
  function done(){
    if(finished) return; finished = true;
    document.body.classList.remove('printing-label'); box.innerHTML = '';
    if(st.parentNode) st.parentNode.removeChild(st);
    window.removeEventListener('afterprint', done);
    lblPrinting = false;
    if(cb) cb();
  }
  window.addEventListener('afterprint', done);
  setTimeout(function(){ try{ window.print(); }catch(err){ setToast('Não foi possível abrir a impressão.'); done(); return; } setTimeout(done, 3000); }, 80);
}
// Envia para a fila (aparelhos comuns) ou imprime direto (estação / sem db)
function lblSend(it, copies){
  var n = Math.max(1, Math.min(50, parseInt(copies, 10) || 1));
  if(state.lblStation || !db){ lblPrint(it, n); return; }
  var job = {itemId:it.id||'', productName:it.productName, storageType:it.storageType, madeDate:it.madeDate, validade:it.validade,
    weight:it.weight||'', copies:n, status:'pending', createdAt:new Date().toISOString()};
  lblWrite('labelQueue', uid('job'), job).then(function(){
    setToast(lblStationOnline() ? 'Enviada para a impressora.' : 'Enviada, mas a estação de impressão está offline.');
  });
  render();
}
// Estação: pega pedidos pendentes e imprime um por vez
var lblDoneJobs = {};
function lblProcessQueue(){
  if(!state.lblStation || !db || lblPrinting) return;
  var next = lblPending().filter(function(j){ return !lblDoneJobs[j.id]; })[0];
  if(!next) return;
  lblDoneJobs[next.id] = 1;
  lblPrint(next, next.copies, function(){
    var data = Object.assign({}, next); delete data.id;
    data.status = 'printed'; data.printedAt = new Date().toISOString();
    lblWrite('labelQueue', next.id, data);
    var printed = Object.keys(state.labelQueue).map(function(k){ return state.labelQueue[k]; })
      .filter(function(j){ return j.status === 'printed'; })
      .sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
    printed.slice(30).forEach(function(j){ lblRemove('labelQueue', j.id); });
    setTimeout(lblProcessQueue, 600);
  });
}
function lblHeartbeat(){
  if(!state.lblStation || !db) return;
  var at = new Date().toISOString();
  sb.from('label_docs').upsert({coll:'labelConfig', id:'station', data:{at:at}, updated_at:at}).then(function(){});
}
state.lblStation = lblStationLoad();
setInterval(function(){ lblHeartbeat(); lblProcessQueue(); }, 15000);
setInterval(function(){
  var ae = document.activeElement;
  if(state.tab === 'labels' && !(ae && ae.id && ae.id.indexOf('lbl-') === 0)) render();
}, 30000);
setTimeout(function(){ lblHeartbeat(); lblProcessQueue(); }, 2500);

function renderLblPrinting(){
  var cfg = lblCfg(), c = state.lblCfgDraft || {w:String(cfg.width), h:String(cfg.height)};
  state.lblCfgDraft = c;
  var online = lblStationOnline();
  var statusCls = state.lblStation ? 'on' : (online ? 'on' : 'off');
  return '' +
  '<div class="card lbl-form">' +
    '<div class="lbl-station '+statusCls+'" style="margin:0 0 12px;">'+lblStationText()+'</div>' +
    '<p class="lbl-hint">A etiqueta é impressa no computador da impressora. Nos outros aparelhos (celular, tablet), o toque em "Gerar e imprimir" manda o pedido para ele, que imprime sozinho.</p>' +
    (state.lblStation
      ? '<button class="btn btn-ghost btn-block" data-action="lbl-station-off">Desativar estação neste aparelho</button>'
      : '<button class="btn btn-primary btn-block" data-action="lbl-station-on">Este computador é a estação de impressão</button>') +
  '</div>' +
  '<div class="card lbl-form" style="margin-top:12px;">' +
    '<div class="lbl-name" style="margin-bottom:8px;">Tamanho da etiqueta</div>' +
    '<div class="two-col">' +
      '<div class="field"><label for="lbl-cw">Largura (mm)</label><input type="number" inputmode="decimal" min="10" max="200" id="lbl-cw" value="'+esc(c.w)+'"></div>' +
      '<div class="field"><label for="lbl-ch">Altura (mm)</label><input type="number" inputmode="decimal" min="10" max="300" id="lbl-ch" value="'+esc(c.h)+'"></div>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" data-action="lbl-cfg-save">Salvar tamanho</button>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="lbl-test">Imprimir etiqueta de teste</button>' +
  '</div>' +
  '<div class="card" style="margin-top:12px;padding:14px;">' +
    '<div class="lbl-name" style="margin-bottom:6px;">Como configurar o computador da impressora</div>' +
    '<ol class="lbl-steps">' +
      '<li>No Windows, em Impressoras e scanners &gt; ClickTag &gt; Preferências de impressão &gt; Papel de etiquetas &gt; <b>Novo...</b>, crie o tamanho "O Cedro" com a medida acima. Não altere o tamanho que já existe.</li>' +
      '<li>Crie um atalho do Chrome com <b>--kiosk-printing</b> e uma pasta de perfil só para as etiquetas (o suporte ou eu passamos o comando).</li>' +
      '<li>Abra o app por esse atalho, vá em Etiquetas &gt; Impressão e toque no botão acima. Imprima um teste escolhendo a ClickTag e o tamanho "O Cedro"; depois disso ele imprime sozinho.</li>' +
    '</ol>' +
  '</div>';
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action^="lbl-"]');
  if(!el) return;
  var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
  if(a === 'lbl-seg'){ state.lblSeg = el.getAttribute('data-seg'); state.lblConfirm = null; render(); return; }
  if(a === 'lbl-generate'){ lblGenerate(false); return; }
  if(a === 'lbl-generate-print'){ lblGenerate(true); return; }
  if(a === 'lbl-print'){ var pit = state.labelItems[id]; if(pit) lblSend(pit, 1); return; }
  if(a === 'lbl-station-on'){ state.lblStation = true; lblStationSave(true); lblHeartbeat(); lblProcessQueue(); render(); setToast('Estação de impressão ativada.'); return; }
  if(a === 'lbl-station-off'){ state.lblStation = false; lblStationSave(false); render(); setToast('Estação desativada neste aparelho.'); return; }
  if(a === 'lbl-cfg-save'){
    var d = state.lblCfgDraft || {}, w = parseFloat(String(d.w).replace(',', '.')), h = parseFloat(String(d.h).replace(',', '.'));
    if(!(w >= 10 && w <= 200 && h >= 10 && h <= 300)){ setToast('Informe largura e altura válidas (em mm).'); return; }
    state.labelCfg = {width:w, height:h};
    if(db){ lblWrite('labelConfig', 'main', {width:w, height:h}); }
    state.lblCfgDraft = null; render(); setToast('Tamanho salvo: ' + w + ' x ' + h + ' mm.'); return;
  }
  if(a === 'lbl-test'){
    lblPrint({productName:'ETIQUETA DE TESTE', storageType:'Refrigerado', madeDate:lblToday(), validade:lblAddDays(lblToday(), 3), weight:'500g'}, 1); return;
  }
  if(a === 'lbl-copy'){
    var cit = state.labelItems[id]; if(!cit) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lblText(cit)).then(function(){ setToast('Texto da etiqueta copiado!'); }).catch(function(){ setToast('Não foi possível copiar.'); });
    } else { setToast('Cópia não suportada neste navegador.'); }
    return;
  }
  if(a === 'lbl-del'){ lblRemove('labelItems', id).then(function(){ setToast('Etiqueta excluída.'); }); if(db) render(); return; }
  if(a === 'lbl-prod-add'){ lblAddProduct(); return; }
  if(a === 'lbl-prod-del'){ state.lblConfirm = id; render(); return; }
  if(a === 'lbl-prod-del-yes'){ lblDeleteProduct(id); return; }
  if(a === 'lbl-cancel'){ state.lblConfirm = null; render(); return; }
  if(a === 'lbl-rule-add'){ lblAddRule(); return; }
  if(a === 'lbl-rule-del'){ lblRemove('labelRules', id).then(function(){ setToast('Validade excluída.'); }); if(db) render(); return; }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id === 'lbl-weight') state.lbl.weight = t.value;
  else if(t.id === 'lbl-newprod') state.lblNewProd = t.value;
  else if(t.id === 'lbl-rdays') state.lblRule.days = t.value;
  else if(t.id === 'lbl-copies') state.lbl.copies = t.value;
  else if(t.id === 'lbl-cw'){ state.lblCfgDraft = state.lblCfgDraft || {}; state.lblCfgDraft.w = t.value; }
  else if(t.id === 'lbl-ch'){ state.lblCfgDraft = state.lblCfgDraft || {}; state.lblCfgDraft.h = t.value; }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id === 'lbl-prod'){ state.lbl.productId = t.value; state.lbl.storageType = ''; render(); }
  else if(t.id === 'lbl-type'){ state.lbl.storageType = t.value; render(); }
  else if(t.id === 'lbl-date'){ state.lbl.date = t.value; render(); }
  else if(t.id === 'lbl-rprod'){ state.lblRule.productId = t.value; }
  else if(t.id === 'lbl-rtype'){ state.lblRule.storageType = t.value; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.id === 'lbl-newprod'){ e.preventDefault(); lblAddProduct(); }
});


document.addEventListener('submit', function(e){
  if(e.target.id === 'login-form'){ e.preventDefault(); doLogin(e.target); return; }
  if(e.target.id === 'item-form'){ e.preventDefault(); saveItemForm(e.target); }
  if(e.target.id === 'supplier-form'){ e.preventDefault(); saveSupplierForm(e.target); }
  if(e.target.id === 'extra-form'){ e.preventDefault(); saveExtraReq(e.target); }
  if(e.target.id === 'posto-pass-form'){ e.preventDefault(); savePostoPass(e.target); }
});

function boot(){ render(); initAuth(); }
boot();

})();
</script>
