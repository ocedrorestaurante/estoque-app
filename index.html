<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estoque O Cedro</title>
<meta name="theme-color" content="#2F4A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EEF1E9;
  --bg-raised:#F8FAF4;
  --surface:#FFFFFF;
  --ink:#1E2A20;
  --ink-dim:#5B6B5A;
  --line:#D6DCC9;
  --line-strong:#B9C4A8;
  --primary:#2F4A3C;
  --primary-strong:#18291F;
  --primary-soft:#DEE8DA;
  --accent:#9C6B2E;
  --accent-strong:#7A5220;
  --accent-soft:#F0E1C4;
  --danger:#B3261E;
  --danger-soft:#F6D9D6;
  --warning:#9A6B12;
  --warning-soft:#F3E3BC;
  --ok:#2F6B4F;
  --ok-soft:#DBEBDF;
  --shadow:0 1px 2px rgba(24,41,31,0.06), 0 8px 24px -12px rgba(24,41,31,0.18);
  --radius:14px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161C17; --bg-raised:#1D251E; --surface:#212B22; --ink:#E9EFE6; --ink-dim:#9DAC98;
    --line:#334035; --line-strong:#465A49; --primary:#8FBBA0; --primary-strong:#B9DAC4; --primary-soft:#26382A;
    --accent:#D8A85C; --accent-strong:#EEC888; --accent-soft:#3A2F1C;
    --danger:#E38B84; --danger-soft:#3B211F; --warning:#E4B95C; --warning-soft:#3A2E15;
    --ok:#8FCBA6; --ok-soft:#1F3626; --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#161C17; --bg-raised:#1D251E; --surface:#212B22; --ink:#E9EFE6; --ink-dim:#9DAC98;
  --line:#334035; --line-strong:#465A49; --primary:#8FBBA0; --primary-strong:#B9DAC4; --primary-soft:#26382A;
  --accent:#D8A85C; --accent-strong:#EEC888; --accent-soft:#3A2F1C;
  --danger:#E38B84; --danger-soft:#3B211F; --warning:#E4B95C; --warning-soft:#3A2E15;
  --ok:#8FCBA6; --ok-soft:#1F3626; --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right));
  padding-bottom:96px;min-height:100vh;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
a{color:var(--primary-strong);}
::selection{background:var(--accent-soft);}
.app-header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:10px;
  margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line);}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:32px;height:32px;flex:none;color:var(--primary);}
.brand-text{min-width:0;}
.brand-text h1{font-size:1.1rem;color:var(--primary-strong);line-height:1.1;}
.brand-text .sub{font-size:0.68rem;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:0.68rem;color:var(--ink-dim);
  padding:5px 9px;border-radius:999px;background:var(--bg-raised);border:1px solid var(--line);white-space:nowrap;flex:none;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
.sync-dot.syncing{background:var(--warning);animation:pulse 1.2s ease-in-out infinite;}
.sync-dot.offline{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.view-title{margin-top:10px;font-size:1.45rem;}
.view-caption{margin-top:2px;font-size:0.83rem;color:var(--ink-dim);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px -12px rgba(0,0,0,0.25);}
.tab-btn{appearance:none;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-dim);padding:6px 10px;border-radius:10px;min-width:64px;font-size:0.66rem;font-weight:600;letter-spacing:.01em;}
.tab-btn svg{width:20px;height:20px;}
.tab-btn.active{color:var(--primary-strong);}
.tab-btn.active svg{color:var(--primary);}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
main{max-width:720px;margin:0 auto;padding-top:14px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:999px;font-size:0.85rem;font-weight:600;cursor:pointer;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip .count{font-family:var(--font-mono);opacity:.75;margin-left:4px;font-size:0.78em;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:0.7rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.field input[type="text"],.field input[type="tel"],.field input[type="number"],.field select,.field textarea{
  font-family:inherit;font-size:0.95rem;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%;}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:420px){.two-col{grid-template-columns:1fr;}}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-dim);}
.search-wrap input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:0.92rem;}
.meta-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.meta-row .field{flex:1;margin-bottom:0;min-width:140px;}
.category{margin-bottom:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;}
.category-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:var(--bg-raised);border:none;cursor:pointer;text-align:left;}
.category-head h3{font-size:0.96rem;color:var(--primary-strong);}
.category-head .progress{font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-dim);white-space:nowrap;}
.category-head .chev{width:16px;height:16px;color:var(--ink-dim);transition:transform .15s ease;flex:none;}
.category.collapsed .chev{transform:rotate(-90deg);}
.category-body{border-top:1px solid var(--line);}
.category.collapsed .category-body{display:none;}
.item-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);position:relative;}
.item-row:last-child{border-bottom:none;}
.item-row.low{background:var(--danger-soft);}
.item-status-stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.item-row.low .item-status-stripe{background:var(--danger);}
.item-main{flex:1;min-width:0;}
.item-name{font-size:0.91rem;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:5px;}
.item-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center;}
.tag{font-size:0.67rem;color:var(--ink-dim);background:var(--bg-raised);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:var(--font-mono);}
.tag.low-tag{color:var(--danger);background:var(--danger-soft);border-color:transparent;font-family:var(--font-body);font-weight:700;}
.stepper{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);}
.stepper button{width:32px;height:34px;border:none;background:var(--bg-raised);color:var(--primary-strong);font-size:1.1rem;cursor:pointer;line-height:1;}
.stepper button:active{background:var(--primary-soft);}
.stepper input{width:50px;text-align:center;border:none;background:var(--surface);color:var(--ink);
  font-family:var(--font-mono);font-size:0.95rem;padding:0 2px;height:34px;}
.stepper input:focus{outline:none;background:var(--accent-soft);}
.finalize-bar{position:fixed;left:0;right:0;bottom:64px;z-index:25;display:flex;justify-content:center;padding:0 16px;pointer-events:none;}
.finalize-inner{pointer-events:auto;max-width:688px;width:100%;background:var(--primary-strong);color:#fff;
  border-radius:14px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:var(--shadow);margin-bottom:10px;}
.finalize-inner .label{font-size:0.78rem;opacity:.85;}
.finalize-inner .label b{font-family:var(--font-mono);color:#fff;}
.btn{appearance:none;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:0.88rem;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-accent{background:var(--accent);color:#2A1B08;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
.btn-primary{background:var(--primary);color:#fff;}
:root[data-theme="dark"] .btn-primary{color:var(--primary-strong);background:var(--primary-soft);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:var(--primary-strong);background:var(--primary-soft);}}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:0.76rem;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:default;}
.icon-btn{background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-dim);}
.icon-btn svg{width:15px;height:15px;}
.row-actions{display:flex;gap:6px;flex:none;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-head h3{font-size:1rem;color:var(--primary-strong);}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:999px;}
.pill-bar{background:var(--accent-soft);color:var(--accent-strong);}
.pill-vinhos{background:#EAD9E8;color:#7A3D6E;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill-vinhos{background:#3A2A38;color:#E3B6DC;}}
:root[data-theme="dark"] .pill-vinhos{background:#3A2A38;color:#E3B6DC;}
.pill-cozinha{background:var(--ok-soft);color:var(--ok);}
.pill-sobremesas{background:#F3DCE3;color:#8A3B57;}
.pill-proteinas{background:#F4DCCF;color:#8A4325;}
.pill-massas{background:#F3E8C4;color:#7A5A12;}
:root[data-theme="dark"] .pill-massas{background:#3A321C;color:#E9CF8A;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill-massas{background:#3A321C;color:#E9CF8A;}}
:root[data-theme="dark"] .pill-sobremesas{background:#3A2830;color:#E8B4C6;}
:root[data-theme="dark"] .pill-proteinas{background:#3A2A22;color:#EBB89C;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill-sobremesas{background:#3A2830;color:#E8B4C6;} :root:not([data-theme="light"]) .pill-proteinas{background:#3A2A22;color:#EBB89C;}}
.sec-search{margin:0 0 10px;}
.sec-from{font-size:0.72rem;color:var(--ink-dim);font-weight:400;}
.sec-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:0.82rem;color:var(--ink-dim);margin-top:10px;}
.sec-foot select{padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
.pill-low{background:var(--danger-soft);color:var(--danger);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-dim);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;color:var(--line-strong);}
.po-summary{font-size:0.85rem;color:var(--ink-dim);margin:0 0 10px;}
.po-group{margin-bottom:12px;padding:0 !important;overflow:hidden;}
.po-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.po-head h3{font-size:1rem;color:var(--primary-strong);margin:0;}
.po-head .contact{font-size:0.75rem;color:var(--ink-dim);margin-top:2px;}
.po-head-r{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:0.78rem;}
.po-head-r .chev{width:16px;height:16px;color:var(--ink-dim);transition:transform .15s ease;transform:rotate(-90deg);}
.po-group.open .po-head-r .chev{transform:none;}
.po-buy{color:var(--danger);font-weight:700;}
.po-ok{color:var(--ink-dim);}
.po-body{display:none;border-top:1px solid var(--line);}
.po-group.open .po-body{display:block;}
.po-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 36px 50px 58px;gap:4px;align-items:center;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);}
.po-row.low{background:var(--danger-soft);}
.po-hd{font-size:0.64rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding-top:6px;padding-bottom:6px;}
.po-c{text-align:center;}
.po-name{font-size:0.88rem;font-weight:600;line-height:1.25;}
.po-name small{display:block;font-size:0.7rem;color:var(--ink-dim);font-weight:500;margin-top:2px;}
.po-nc{color:var(--warning);font-weight:700;}
.po-st{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;}
.po-row.low .po-st{color:var(--danger);}
.po-st.none{color:var(--ink-dim);font-size:1rem;}
.po-min{font-family:var(--font-mono);font-size:0.82rem;color:var(--ink-dim);}
.po-sug{font-family:var(--font-mono);font-size:0.9rem;font-weight:700;color:var(--ink-dim);}
.po-row.low .po-sug{color:var(--danger);}
.po-in{width:100%;font-family:var(--font-mono);font-size:0.95rem;text-align:center;padding:7px 2px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
.po-in::placeholder{color:var(--line-strong);opacity:1;}
.po-in:focus{outline:2px solid var(--accent);outline-offset:1px;}
.po-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;}
.order-group{margin-bottom:16px;}
.order-group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.order-group-head h3{font-size:1rem;color:var(--primary-strong);}
.order-group-head .contact{font-size:0.75rem;color:var(--ink-dim);}
.order-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);}
.order-item:last-child{border-bottom:none;}
.order-item .oi-name{font-size:0.89rem;font-weight:600;}
.order-item .oi-sub{font-size:0.74rem;color:var(--ink-dim);margin-top:2px;}
.order-item .oi-qty{font-family:var(--font-mono);font-size:0.89rem;color:var(--danger);font-weight:700;white-space:nowrap;text-align:right;}
.order-item .oi-qty small{display:block;font-family:var(--font-body);color:var(--ink-dim);font-weight:500;font-size:0.66rem;}
.segmented{display:flex;background:var(--bg-raised);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px;}
.segmented button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:8px;font-weight:700;font-size:0.8rem;color:var(--ink-dim);cursor:pointer;}
.segmented button.active{background:var(--surface);color:var(--primary-strong);box-shadow:var(--shadow);}
.fab-row{display:flex;justify-content:flex-end;margin-bottom:12px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,26,20,0.5);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal-sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,0.3);}
@media (min-width:560px){.modal-backdrop{align-items:center;}.modal-sheet{border-radius:18px;}}
.modal-sheet h2{font-size:1.12rem;margin-bottom:14px;color:var(--primary-strong);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.confirm-row{display:flex;align-items:center;gap:8px;background:var(--danger-soft);border-radius:10px;padding:8px 10px;margin-top:8px;}
.confirm-row span{font-size:0.76rem;color:var(--danger);flex:1;}
.toast-wrap{position:fixed;left:0;right:0;bottom:150px;display:flex;justify-content:center;z-index:60;pointer-events:none;}
.toast{background:var(--primary-strong);color:#fff;padding:9px 16px;border-radius:999px;font-size:0.82rem;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease;}
.toast.show{opacity:1;transform:translateY(0);}
.history-row{padding:12px 14px;}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
.history-head .hh-left{display:flex;flex-direction:column;gap:2px;}
.history-head .hh-date{font-weight:700;font-size:0.9rem;}
.history-head .hh-meta{font-size:0.74rem;color:var(--ink-dim);}
.history-detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none;}
.history-row.open .history-detail{display:block;}
.hd-item{display:flex;justify-content:space-between;font-size:0.82rem;padding:4px 0;}
.hd-item .low{color:var(--danger);font-weight:700;}
.note-icon{width:13px;height:13px;color:var(--ink-dim);flex:none;}
.banner{padding:9px 14px;border-radius:10px;font-size:0.8rem;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
.banner-warning{background:var(--warning-soft);color:var(--warning);}
.banner-info{background:var(--primary-soft);color:var(--primary-strong);}
.section-intro{color:var(--ink-dim);font-size:0.85rem;margin-bottom:14px;}
.extra-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);color:var(--accent-strong);border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:0.82rem;}
.extra-cta b{font-weight:700;}
.extra-cta .btn{background:var(--accent);color:#2A1B08;flex:none;}
.extra-card{border-left:4px solid var(--accent);}
.extra-card h3{font-size:1rem;color:var(--primary-strong);margin:0;}
.extra-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.extra-txt{font-size:0.92rem;white-space:pre-wrap;word-break:break-word;}
.extra-meta{font-size:0.74rem;color:var(--ink-dim);margin-top:2px;}
.extra-acts{display:flex;gap:6px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.extra-list{max-height:160px;overflow:auto;margin:4px 0 10px;padding:8px 10px;background:var(--bg-raised);border-radius:10px;font-size:0.8rem;color:var(--ink-dim);}
.extra-list div{padding:2px 0;}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
.acc-row:first-of-type{border-top:none;}
.acc-name{font-weight:700;font-size:0.95rem;}
.acc-pass{font-family:var(--font-mono);letter-spacing:.04em;}
@media (min-width:720px){.item-row{padding:12px 18px;}}

.btn svg{width:16px;height:16px;flex:none;}
.count-tools{display:flex;gap:8px;margin-bottom:14px;align-items:stretch;}
.count-tools .btn{flex:1;justify-content:center;padding:11px 10px;}
.tool-icon{width:44px;height:auto;flex:none;}
.tool-icon svg{width:18px;height:18px;}
.stepper input{width:58px;}
.stepper input::placeholder{color:var(--ink-dim);opacity:.75;font-size:.7rem;}
.item-row.nc{background:var(--bg-raised);}
.item-row.nc .item-name{color:var(--ink-dim);}
.nc-btn{appearance:none;border:none;background:none;color:var(--ink-dim);width:28px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-left:-4px;border-radius:8px;}
.nc-btn svg{width:18px;height:18px;}
.nc-btn:focus-visible,.nc-chip:focus-visible{outline:2px solid var(--accent);}
.nc-chip{appearance:none;border:1px dashed var(--line-strong);background:var(--surface);color:var(--ink-dim);border-radius:10px;padding:6px 10px;font-size:.78rem;font-weight:600;cursor:pointer;flex:none;text-align:right;line-height:1.2;}
.nc-chip small{display:block;font-weight:500;color:var(--accent-strong);font-size:.7rem;}
.tag.nc-tag{color:var(--warning);background:var(--warning-soft);border-color:transparent;font-family:var(--font-body);font-weight:700;}
.sheet-full{max-width:560px;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));}
@media (min-width:560px){.sheet-full{height:auto;min-height:70vh;max-height:92vh;border-radius:18px;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.sheet-head h2{margin:0 !important;}
.sheet-scroll{flex:1;overflow:auto;margin:0 -4px;padding:0 4px 8px;}
.g-top{display:flex;align-items:center;gap:12px;}
.g-top .icon-btn{width:38px;height:38px;}
.g-top .icon-btn svg{width:18px;height:18px;}
.g-progress{flex:1;min-width:0;}
.g-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.g-bar span{display:block;height:100%;background:var(--accent);transition:width .25s ease;}
.g-count{font-size:.72rem;color:var(--ink-dim);margin-top:5px;}
.g-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 16px;}
.g-place{font-size:.82rem;color:var(--accent-strong);font-weight:700;}
.g-name{font-size:1.9rem;line-height:1.1;margin:6px 0 10px !important;color:var(--primary-strong);}
.g-stepper{display:flex;align-items:stretch;margin-top:22px;border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;background:var(--surface);}
.g-stepper button{width:72px;border:none;background:var(--bg-raised);font-size:1.8rem;color:var(--primary-strong);cursor:pointer;}
.g-stepper button:active{background:var(--primary-soft);}
.g-stepper input{flex:1;min-width:0;border:none;text-align:center;font-family:var(--font-mono);font-size:2.4rem;padding:14px 4px;background:var(--surface);color:var(--ink);}
.g-stepper input:focus{outline:none;background:var(--accent-soft);}
.g-stepper input::placeholder{color:var(--line-strong);}
.g-hint{margin-top:8px;font-size:.78rem;color:var(--ink-dim);text-align:center;}
.g-low{margin-top:10px;color:var(--danger);font-size:.84rem;font-weight:600;text-align:center;}
.g-nc{margin-top:22px;padding:24px;border:1px dashed var(--line-strong);border-radius:16px;text-align:center;color:var(--ink-dim);font-weight:600;}
.g-actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;}
.g-actions .btn{justify-content:center;padding:14px 8px;}
.g-next-hint{margin-top:12px;font-size:.78rem;color:var(--ink-dim);text-align:center;}
.scan-camera{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:10px;min-height:200px;}
.scan-camera video{width:100% !important;display:block;}
.btn-block{width:100%;justify-content:center;}
.switch-row{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;margin:2px 0 14px;cursor:pointer;}
.switch-row input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none;}
.switch-row small{color:var(--ink-dim);}
.scan-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;}
.scan-card.hit{border-color:var(--ok);background:var(--ok-soft);}
.scan-card.miss{border-color:var(--warning);background:var(--warning-soft);}
.scan-card .item-name{font-size:1rem;}
.scan-card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.scan-note{font-size:.8rem;color:var(--warning);margin:6px 0 10px;}
.link-list{margin-top:8px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
.link-opt{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:.88rem;font-family:inherit;}
.link-opt:last-child{border-bottom:none;}
.link-opt small{display:block;color:var(--ink-dim);font-size:.72rem;}
.route-cat{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden;}
.route-cat-head{display:flex;align-items:center;gap:8px;padding:6px 10px;}
.route-toggle{flex:1;appearance:none;border:none;background:none;text-align:left;font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--primary-strong);cursor:pointer;padding:8px 0;display:flex;gap:8px;align-items:center;}
.route-toggle .mono{font-size:.72rem;color:var(--ink-dim);font-weight:500;font-family:var(--font-mono);}
.route-moves{display:flex;gap:4px;}
.route-moves .icon-btn{width:34px;height:34px;}
.route-moves .icon-btn:disabled{opacity:.3;cursor:default;}
.route-items{border-top:1px solid var(--line);background:var(--bg-raised);}
.route-item{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 14px;border-bottom:1px solid var(--line);font-size:.86rem;}
.route-item:last-child{border-bottom:none;}
.route-item .pos{font-family:var(--font-mono);color:var(--ink-dim);font-size:.72rem;width:22px;flex:none;}
.route-item .nm{flex:1;min-width:0;}
.stale-list{margin:6px 0 0;padding-left:18px;}
.hd-item.skipped{color:var(--ink-dim);}
.hd-sup{display:flex;justify-content:space-between;font-size:0.8rem;font-weight:700;color:var(--ink);padding:8px 0 3px;margin-top:4px;border-bottom:1px solid var(--line);}
.hd-sup:first-child{margin-top:0;padding-top:0;}
.history-head .chev{width:16px;height:16px;flex:none;color:var(--ink-dim);transition:transform .15s ease;}
.history-row.open .history-head .chev{transform:rotate(180deg);}
.hd-item small{font-family:var(--font-body);font-size:.72rem;font-weight:500;}
.hd-item > span:last-child{white-space:nowrap;padding-left:8px;}
.hd-buy{color:var(--danger);font-weight:600;}
.hd-item.low{color:var(--danger);font-weight:600;}
.head-actions{display:flex;align-items:center;gap:8px;flex:none;}
.head-actions .icon-btn{width:32px;height:32px;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:var(--shadow);}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-brand svg{width:40px;height:40px;color:var(--primary);}
.login-brand h1{font-size:1.5rem;color:var(--primary-strong);line-height:1;}
.login-brand .sub{font-size:.8rem;color:var(--ink-dim);margin-top:4px;}
.login-card input[type=email],.login-card input[type=password]{font-family:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%;}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.login-error{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:.84rem;margin-bottom:12px;}
.login-help{margin:16px 0 0;font-size:.8rem;color:var(--ink-dim);text-align:center;}
.hist-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px;}
.share-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.share-list .btn{justify-content:flex-start;}
.share-list .btn small{margin-left:auto;color:var(--ink-dim);font-weight:500;}
.share-sum{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem;color:var(--ink-dim);}
.share-edit{margin-top:6px;font-size:.8rem;}
.kind-row{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;flex-wrap:wrap;}
.seg{display:inline-flex;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:3px;}
.seg button{appearance:none;border:none;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;gap:6px;}
.seg button .count{font-family:var(--font-mono);font-size:.72rem;opacity:.8;font-weight:500;}
.seg button.active{background:var(--surface);color:var(--primary-strong);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.kind-lock{font-size:.86rem;font-weight:700;color:var(--primary-strong);background:var(--primary-soft);border-radius:10px;padding:7px 12px;}
.link-btn{appearance:none;border:none;background:none;padding:4px 2px;font:inherit;font-size:.8rem;color:var(--accent-strong);font-weight:600;cursor:pointer;text-decoration:underline;}
.daily-cat{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;}
.daily-cat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg-raised);border-bottom:1px solid var(--line);}
.daily-cat-head b{font-family:var(--font-display);color:var(--primary-strong);font-size:.92rem;}
.daily-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer;}
.daily-opt:last-child{border-bottom:none;}
.daily-opt input{width:20px;height:20px;accent-color:var(--primary);flex:none;}
.check-row{display:flex;align-items:center;gap:10px;font-size:.9rem;margin:4px 0 14px;cursor:pointer;}
.check-row input{width:20px;height:20px;accent-color:var(--primary);}
.kind-tag{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--primary-soft);color:var(--primary-strong);margin-right:6px;vertical-align:1px;}
.kind-tag.diaria{background:var(--accent-soft);color:var(--accent-strong);}
.loading-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}

/* ===== Etiquetas de validade ===== */
.field input[type="date"]{font-family:inherit;font-size:0.95rem;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%;min-height:42px;}
.field input[type="date"]:focus{outline:2px solid var(--accent);outline-offset:1px;}
@media (max-width:520px){.lbl-main{flex:1 1 100%;}}
.lbl-form .field{margin-bottom:10px;}
.lbl-preview{font-size:.82rem;color:var(--ink-dim);margin:2px 0 12px;min-height:1.2em;}
.lbl-preview b{color:var(--ink);font-family:var(--font-mono);}
.lbl-list{margin-top:6px;}
.lbl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--line-strong);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.lbl-row.ok{border-left-color:var(--ok);}
.lbl-row.warn{border-left-color:var(--warning);}
.lbl-row.danger{border-left-color:var(--danger);}
.lbl-main{flex:1;min-width:180px;}
.lbl-name{font-size:.95rem;font-weight:700;line-height:1.25;}
.lbl-meta{margin-top:3px;font-size:.76rem;color:var(--ink-dim);font-family:var(--font-mono);}
.lbl-pill{display:inline-flex;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.lbl-pill.ok{background:var(--ok-soft);color:var(--ok);}
.lbl-pill.warn{background:var(--warning-soft);color:var(--warning);}
.lbl-pill.danger{background:var(--danger-soft);color:var(--danger);}
.lbl-rules-group{margin-bottom:10px;}
.lbl-rule-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.88rem;}
.lbl-rule-line:last-child{border-bottom:none;}
.lbl-rule-line .d{font-family:var(--font-mono);font-weight:600;}
.lbl-hint{font-size:.8rem;color:var(--ink-dim);margin:0 0 10px;}
#print-label{display:none;}
@media print{
  body.printing-label{padding:0 !important;min-height:0 !important;background:#fff !important;}
  body.printing-label #app, body.printing-label #modal-root, body.printing-label .toast-wrap{display:none !important;}
  body.printing-label #print-label{display:block;background:#fff;color:#000;font-family:Arial, Helvetica, sans-serif;}
  body.printing-label .pl-page{page-break-after:always;break-after:page;}
  body.printing-label .pl-page:last-child{page-break-after:auto;break-after:auto;}
}
#print-label .pl-page{display:flex;flex-direction:column;justify-content:center;gap:.45em;box-sizing:border-box;overflow:hidden;background:#fff;color:#000;}
#print-label .pl-name{font-size:1.5em;font-weight:700;line-height:1.1;word-break:break-word;}
#print-label .pl-tag{font-size:.8em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-top:.18em solid #000;padding-top:.3em;}
#print-label .pl-line{font-size:1.1em;line-height:1.2;}
#print-label .pl-line span,#print-label .pl-val span{font-weight:400;}
#print-label .pl-val{font-size:1.5em;font-weight:700;line-height:1.2;border:.14em solid #000;padding:.2em .35em;}
#print-label .pl-foot{font-size:.7em;letter-spacing:.14em;text-align:right;margin-top:auto;}
.lbl-three{display:grid;grid-template-columns:1fr 1fr 78px;gap:10px;}
@media (max-width:420px){.lbl-three{grid-template-columns:1fr 1fr;}.lbl-three .qty{grid-column:1/-1;}}
.lbl-station{margin-top:12px;font-size:.8rem;font-weight:600;padding:8px 12px;border-radius:10px;}
.lbl-station.on{background:var(--ok-soft);color:var(--ok);}
.lbl-station.off{background:var(--warning-soft);color:var(--warning);}
.lbl-steps{margin:0;padding-left:20px;font-size:.84rem;color:var(--ink-dim);line-height:1.5;}
.lbl-steps li{margin-bottom:8px;}
.lbl-steps b{color:var(--ink);}

  var draft = state.draft[state.sector];

  if(!filled.length) return '';
  var ncN = filled.filter(function(k){ return isNC(draft[k]); }).length;
  var countedN = filled.length - ncN;
  var bottomStyle = state.scopedSector ? ' style="bottom:0"' : '';
  return '' +
  '<div class="finalize-bar"'+bottomStyle+'><div class="finalize-inner">' +

// ---------- Orders tab ----------
var ORDER_NOSUP = 'zzzz-sem-fornecedor';
function orderSuggestion(it){
  if(!isLow(it)) return null;
  var s = it.minStock - (it.currentCount || 0);
  return s > 0 ? s : it.minStock;
}
function loadOrderQty(){
  if(state.orderQty) return state.orderQty;
  state.orderQty = {};
  try{ var v = JSON.parse(localStorage.getItem('cedro_order_qty') || '{}'); if(v && typeof v === 'object') state.orderQty = v; }catch(e){}
  return state.orderQty;
}
function saveOrderQty(){ try{ localStorage.setItem('cedro_order_qty', JSON.stringify(state.orderQty || {})); }catch(e){} }
function computeOrderList(){
  var g = groupBy(itemsArray(), function(it){ return supplierLabel(it) || ORDER_NOSUP; });
  var list = g.order.map(function(n){
    var items = g.groups[n].slice().sort(function(a,b){ return a.product.localeCompare(b.product,'pt-BR'); });
    return {key: n, supplier: n===ORDER_NOSUP?null:n, items: items, buyN: items.filter(isLow).length};
  });
  list.sort(function(a,b){
    if(!!a.buyN !== !!b.buyN) return a.buyN ? -1 : 1;
    if(a.key===ORDER_NOSUP) return 1;
    if(b.key===ORDER_NOSUP) return -1;
    return a.key.localeCompare(b.key,'pt-BR');
  });
  return list;
}

function renderOrdersList(){
  var oq = loadOrderQty();
  if(!state.ordersOpen) state.ordersOpen = {};
  var groups = computeOrderList();
  var stale = itemsArray().filter(wasSkippedLast);
  var staleHtml = stale.length ? '<div class="banner banner-warning"><div><b>'+stale.length+' '+(stale.length===1?'item ficou':'itens ficaram')+' sem contagem na última vez.</b> Eles aparecem como "não contado", com a última contagem ao lado.</div></div>' : '';
  if(!groups.length){
    return '<div class="empty-state">'+ICONS.orders+'<div>Nenhum item cadastrado ainda.</div></div>';
  }
  var buyTotal = groups.reduce(function(a,g){ return a + g.buyN; }, 0);
  var summary = '<div class="po-summary">'+(buyTotal ? '<b>'+buyTotal+'</b> '+(buyTotal===1?'item para comprar':'itens para comprar')+' em <b>'+groups.filter(function(g){return g.buyN;}).length+'</b> '+(groups.filter(function(g){return g.buyN;}).length===1?'fornecedor':'fornecedores') : 'Nada no mínimo ou abaixo agora.')+'</div>';
  return staleHtml + summary + groups.map(function(g){
    var open = state.ordersOpen[g.key]; if(open === undefined) open = g.buyN > 0;
    var contact = null;
    if(g.supplier){
      var sup = suppliersArray().filter(function(s){return s.name===g.supplier;})[0];
      contact = sup ? sup.contact : null;
    }
    var filled = g.items.some(function(it){ return num(oq[it.id]) > 0; });
    var rows = g.items.map(function(it){
      var low = isLow(it), sug = orderSuggestion(it);
      var nc = wasSkippedLast(it), never = it.currentCount === null || it.currentCount === undefined;
      var sub = SECTOR_LABEL[it.sector] + ' · ' + esc(it.unit);
      if(nc && !never) sub = '<span class="po-nc">não contado</span> · última '+fmtQty(it.currentCount)+' '+esc(it.unit)+(it.lastCountedAt?' em '+shortDateBR(it.lastCountedAt):'');
      var est = never ? '<span class="po-st none">—</span>' : '<span class="po-st'+(nc?' none':'')+'">'+fmtQty(it.currentCount)+'</span>';
      return '' +
      '<div class="po-row'+(low?' low':'')+'">' +
        '<div class="po-name"><div>'+esc(it.product)+'</div><small>'+(never?'<span class="po-nc">nunca contado</span>':sub)+'</small></div>' +
        '<div class="po-c">'+est+'</div>' +
        '<div class="po-c po-min">'+(it.minStock===null||it.minStock===undefined?'—':fmtQty(it.minStock))+'</div>' +
        '<div class="po-c po-sug">'+(sug!==null?fmtQty(sug):'—')+'</div>' +
        '<div class="po-c"><input class="po-in" type="text" inputmode="decimal" data-action="order-qty" data-id="'+it.id+'" placeholder="'+(sug!==null?fmtQty(sug):'')+'" value="'+esc(oq[it.id]||'')+'" aria-label="Pedido de '+esc(it.product)+'"></div>' +
      '</div>';
    }).join('');
    return '' +
    '<div class="po-group card'+(open?' open':'')+'">' +
      '<div class="po-head" data-action="toggle-order-group" data-key="'+esc(g.key)+'">' +
        '<div><h3>'+esc(g.supplier || 'Sem fornecedor definido')+'</h3>' + (contact?'<div class="contact">'+esc(contact)+'</div>':'') + '</div>' +
        '<div class="po-head-r">'+(g.buyN?'<span class="po-buy">'+g.buyN+' para comprar</span>':'<span class="po-ok">nada para comprar</span>')+ICONS.chev+'</div>' +
      '</div>' +
      '<div class="po-body">' +
        '<div class="po-row po-hd"><div>Item</div><div class="po-c">Estoque</div><div class="po-c">Mín.</div><div class="po-c">Sug.</div><div class="po-c">Pedido</div></div>' +
        rows +

          (filled?'<button class="btn btn-ghost btn-sm" data-action="clear-order" data-key="'+esc(g.key)+'">Limpar pedido</button>':'') +
          '<button class="btn btn-primary btn-sm" data-action="copy-order" data-key="'+esc(g.key)+'">'+ICONS.copy+' Copiar mensagem</button>' +

function buildOrderMessage(supplier, items){
  var oq = loadOrderQty();
  var lines = ['Pedido O Cedro — '+formatDateBR(todayISO()), ''];
  items.forEach(function(it){
    var typed = num(oq[it.id]);

async function loadPostos(){
  state.postosLoading = true;
  try{
    var r = await sb.rpc('list_postos');
    if(r.error) throw r.error;
    state.postos = r.data || []; state.postosErr = null;
  }catch(e){ console.warn('list_postos', e); state.postos = []; state.postosErr = e.message || 'erro'; }
  state.postosLoading = false;
  render();
}
function postoKey(email){ return String(email||'').split('@')[0].toLowerCase(); }
function renderAcessos(){
  if(state.postos === undefined || state.postos === null){ if(!state.postosLoading) loadPostos(); return '<div class="empty-state">Carregando acessos...</div>'; }
  var notReady = state.postosErr && /list_postos|schema cache|function/i.test(state.postosErr);
  var byKey = {};
  state.postos.forEach(function(u){ byKey[postoKey(u.email)] = u; });
  var keys = Object.keys(POSTO_SECTOR);
  Object.keys(byKey).forEach(function(k){ if(keys.indexOf(k) === -1) keys.push(k); });
  var rows = keys.map(function(k){
    var u = byKey[k];
    var sub = (POSTO_SECTOR[k] ? 'Setor ' + SECTOR_LABEL[POSTO_SECTOR[k]] : 'Sem setor travado') +
      (u ? (u.ultimo_acesso ? ' · último acesso ' + formatDateTimeBR(u.ultimo_acesso) : ' · nunca entrou') : (state.postosErr ? '' : ' · login não criado'));
    return '<div class="acc-row"><div><div class="acc-name">'+esc(k)+'</div><div class="extra-meta">'+sub+'</div></div>' +
      ((u || state.postosErr) ? '<button class="btn btn-ghost btn-sm" data-action="posto-pass" data-posto="'+esc(k)+'">Trocar senha</button>' : '') + '</div>';
  }).join('');
  return '<p class="section-intro">Logins dos postos. Na tela de entrada, a pessoa digita só o nome do posto (ex.: <b>bar</b>) e a senha.</p>' +
    (notReady ? '<div class="banner banner-warning"><div>Para ativar a troca de senha, rode o arquivo senhas-postos-supabase.sql no Supabase.</div></div>' :
      (state.postosErr ? '<div class="banner banner-warning"><div>Não foi possível carregar os acessos agora.</div></div>' : '')) +

var JSPDF_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadJsPdf(){
  return new Promise(function(resolve, reject){
    if(window.jspdf && window.jspdf.jsPDF) return resolve();
    var s = document.createElement('script');
    s.src = JSPDF_SRC;
    s.onload = function(){ (window.jspdf && window.jspdf.jsPDF) ? resolve() : reject(new Error('jspdf')); };
    s.onerror = function(){ reject(new Error('jspdf')); };
    document.head.appendChild(s);
  });
}

function lastCountBefore(itemId, s){
  var t = new Date(s.createdAt || 0).getTime();
  for(var i = 0; i < state.sessions.length; i++){
    var o = state.sessions[i];
    if(o.id === s.id) continue;
    if(new Date(o.createdAt || 0).getTime() >= t) continue;
    if(o.counts && o.counts[itemId] !== undefined && o.counts[itemId] !== null) return {qty: o.counts[itemId], at: o.createdAt};
  }
  var it = state.items[itemId];
  if(it && it.lastCountedAt && new Date(it.lastCountedAt).getTime() < t && it.currentCount !== null && it.currentCount !== undefined) return {qty: it.currentCount, at: it.lastCountedAt};
  return null;
}

function shortDateBR(iso){
  var d = new Date(iso); if(isNaN(d)) return '';
  return ('0'+d.getDate()).slice(-2) + '/' + ('0'+(d.getMonth()+1)).slice(-2);
}

function sessionRows(s){
  function mk(id, qty, skipped){
    var it = state.items[id] || {};
    var min = (it.minStock === null || it.minStock === undefined) ? null : it.minStock;
    var last = skipped ? lastCountBefore(id, s) : null;
    var ref = skipped ? (last ? last.qty : null) : qty;
    var low = min !== null && ref !== null && ref !== undefined && ref <= min;
    var sug = null;
    if(low){ sug = min - (ref || 0); if(!(sug > 0)) sug = min; }
    return {id: id, cat: it.category || 'Outros', name: it.product || id, qty: qty, unit: it.unit || '', min: min,
            low: low, sug: sug, skipped: !!skipped, last: last, supplier: (state.items[id] ? supplierLabel(it) : null) || null};
  }
  var rows = Object.keys(s.counts || {}).map(function(id){ return mk(id, s.counts[id], false); });
  var skippedRows = (s.skipped || []).map(function(id){ return mk(id, null, true); });
  var byName = function(a, b){ return a.name.localeCompare(b.name, 'pt-BR'); };
  rows.sort(byName); skippedRows.sort(byName);
  var g = groupBy(rows.concat(skippedRows), function(r){ return r.supplier || 'zzzz-sem-fornecedor'; });
  var groups = g.order.slice().sort(function(a, b){
    if(a === 'zzzz-sem-fornecedor') return 1;
    if(b === 'zzzz-sem-fornecedor') return -1;
    return a.localeCompare(b, 'pt-BR');
  }).map(function(n){
    var items = g.groups[n].slice().sort(byName);
    return {supplier: n === 'zzzz-sem-fornecedor' ? null : n, items: items, buyN: items.filter(function(r){ return r.low; }).length};
  });
  return {rows: rows, skipped: skippedRows.map(function(r){ return r.name; }), skippedRows: skippedRows, groups: groups};
}

function pdfFileName(s){
  var d = (s.createdAt || new Date().toISOString()).slice(0, 10);
  var sec = (s.kind === 'diaria' ? 'diaria-' : '') + String(SECTOR_LABEL[s.sector] || s.sector).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-');
  return 'contagem-' + sec + '-' + d + '.pdf';
}

// PDF em formato de tela de celular: abre no WhatsApp sem precisar de zoom
async function buildPdf(s){
  await loadJsPdf();
  var W = 105, H = 210, M = 6, BOTTOM = H - 10;
  var doc = new window.jspdf.jsPDF({unit: 'mm', format: [W, H]});
  var data = sessionRows(s);
  var green = [47, 74, 60], grey = [120, 120, 120], red = [178, 34, 34], redBg = [252, 233, 233], ink = [30, 30, 30];
  // colunas (borda direita de cada número)
  var X_NAME = M + 1.5, NAME_W = 50, X_EST = 72, X_MIN = 84, X_BUY = W - M - 1.5;
  var y = 12;
  function tc(c){ doc.setTextColor(c[0], c[1], c[2]); }
  function colHead(){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); tc(grey);
    doc.text('Item', X_NAME, y); doc.text('Estoque', X_EST, y, {align: 'right'});
    doc.text('Mín.', X_MIN, y, {align: 'right'}); doc.text('Comprar', X_BUY, y, {align: 'right'});
    y += 2; doc.setDrawColor(200, 200, 200); doc.line(M, y, W - M, y); y += 4.2;
  }
  function supHead(g, cont){
    doc.setFillColor(green[0], green[1], green[2]);
    doc.rect(M, y - 4.6, W - 2*M, 7.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
    var nm = doc.splitTextToSize((g.supplier || 'Sem fornecedor definido') + (cont ? ' (cont.)' : ''), 60)[0];
    doc.text(nm, M + 2, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text(g.buyN ? (g.buyN + ' para comprar') : 'nada para comprar', W - M - 2, y, {align: 'right'});
    y += 7;
    colHead();
  }
  function newPage(g){
    doc.addPage([W, H]); y = 10;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); tc(grey);
    doc.text((SECTOR_LABEL[s.sector] || s.sector) + ' · ' + formatDateTimeBR(s.createdAt), M, y); y += 7;
    if(g) supHead(g, true);
  }

  // cabeçalho
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); tc(green);
  doc.text('O Cedro · Contagem ' + ((KIND_LABEL[s.kind] || 'Completa').toLowerCase()), M, y); y += 5.5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); tc([60, 60, 60]);
  doc.text('Setor: ' + (SECTOR_LABEL[s.sector] || s.sector) + '  ·  ' + formatDateTimeBR(s.createdAt), M, y); y += 4.2;
  if(s.responsavel){ doc.text('Contado por: ' + s.responsavel, M, y); y += 4.2; }
  var buyTotal = data.groups.reduce(function(a, g){ return a + g.buyN; }, 0);
  var supBuy = data.groups.filter(function(g){ return g.buyN; }).length;
  tc(grey);
  doc.text(data.rows.length + ' contados' + (data.skippedRows.length ? ' · ' + data.skippedRows.length + ' não contados' : '') + ' · ' + data.groups.length + ' fornecedores', M, y); y += 4.2;
  if(buyTotal){ tc(red); doc.setFont('helvetica', 'bold'); doc.text(buyTotal + ' itens para comprar em ' + supBuy + ' ' + (supBuy === 1 ? 'fornecedor' : 'fornecedores'), M, y); y += 4.2; }
  y += 4;

  // pedidos fora da lista em aberto
  var extras = openExtras();
  if(extras.length){
    var amber = [156, 107, 46], amberBg = [240, 225, 196];
    doc.setFillColor(amber[0], amber[1], amber[2]);
    doc.rect(M, y - 4.6, W - 2*M, 7.2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
    doc.text('Pedidos fora da lista', M + 2, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text(extras.length + ' em aberto', W - M - 2, y, {align: 'right'});
    y += 7;
    extras.forEach(function(x){
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      var lines = doc.splitTextToSize(String(x.texto || ''), W - 2*M - 3).slice(0, 4);
      var meta = [extraWho(x), formatDateTimeBR(x.criado_em)].filter(function(v){ return v; }).join(' · ');
      var h = 3.9 * lines.length + 3.4 + 3.2;
      if(y + h > BOTTOM) newPage(null);
      var top = y - 3.6;
      doc.setFillColor(amberBg[0], amberBg[1], amberBg[2]); doc.rect(M, top, W - 2*M, h, 'F');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); tc(ink);
      lines.forEach(function(l, i){ doc.text(l, X_NAME, y + i * 3.9); });
      doc.setFontSize(7); tc(grey); doc.text(meta, X_NAME, y + lines.length * 3.9 - 0.4);
      y = top + h;
      doc.setDrawColor(255, 255, 255); doc.line(M, y, W - M, y);
      y += 3.6;
    });
    y += 4;
  }

  data.groups.forEach(function(g){
    if(y + 7 + 6 + 8 > BOTTOM) newPage(null);
    supHead(g, false);
    g.items.forEach(function(r){
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      var lines = doc.splitTextToSize(r.name, NAME_W).slice(0, 2);
      var sub = r.skipped ? (r.last ? 'última: ' + fmtQty(r.last.qty) + ' ' + r.unit + ' em ' + shortDateBR(r.last.at) : 'sem contagem anterior') : '';
      var h = Math.max(3.9 * lines.length + (sub ? 3.4 : 0), 6.4) + 3.2;
      if(y + h > BOTTOM) newPage(g);
      var top = y - 3.6;
      if(r.low){ doc.setFillColor(redBg[0], redBg[1], redBg[2]); doc.rect(M, top, W - 2*M, h, 'F'); }
      // nome
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); tc(r.skipped ? grey : ink);
      lines.forEach(function(l, i){ doc.text(l, X_NAME, y + i * 3.9); });
      if(sub){ doc.setFontSize(7); tc(grey); doc.text(sub, X_NAME, y + lines.length * 3.9 - 0.4); }
      // estoque em destaque
      if(r.skipped){
        doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); tc(grey);
        doc.text('não', X_EST, y - 0.6, {align: 'right'}); doc.text('contado', X_EST, y + 2.6, {align: 'right'});
      } else {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13); tc(r.low ? red : ink);
        doc.text(fmtQty(r.qty), X_EST - 0.2, y + 0.6, {align: 'right'});
        doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); tc(grey);
        doc.text(String(r.unit), X_EST - 0.2, y + 3.6, {align: 'right'});
      }
      // mínimo
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); tc(grey);
      doc.text(r.min === null ? '—' : fmtQty(r.min), X_MIN, y, {align: 'right'});
      // comprar
      if(r.sug !== null){ doc.setFont('helvetica', 'bold'); doc.setFontSize(10); tc(red); doc.text(fmtQty(r.sug), X_BUY, y, {align: 'right'}); }
      else { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); tc([190, 190, 190]); doc.text('—', X_BUY, y, {align: 'right'}); }
      y = top + h;
      doc.setDrawColor(232, 232, 232); doc.line(M, y, W - M, y);
      y += 3.6;
    });
    y += 4;
  });

  var pages = doc.getNumberOfPages();
  for(var i = 1; i <= pages; i++){
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); tc([150, 150, 150]);
    doc.setFillColor(redBg[0], redBg[1], redBg[2]); doc.rect(M, H - 7.4, 3, 2.6, 'F');
    doc.text('no mínimo ou abaixo · vai para Pedidos', M + 4.2, H - 5.2);
    doc.text(i + '/' + pages, W - M, H - 5.2, {align: 'right'});
  }
  return doc.output('blob');
}

async function sharePdf(s){
  var m = state.modal;
  var btn = document.querySelector('[data-action="share-pdf"]');
  try{
    var blob = (m && m.blob) ? m.blob : null;
    if(!blob){
      if(btn){ btn.disabled = true; btn.lastChild.textContent = ' Gerando PDF...'; }
      blob = await buildPdf(s);
      if(m) m.blob = blob;
    }
    var file = new File([blob], pdfFileName(s), {type: 'application/pdf'});
    var text = 'Contagem de estoque O Cedro · ' + (SECTOR_LABEL[s.sector] || s.sector) + ' · ' + formatDateTimeBR(s.createdAt);
    if(navigator.canShare && navigator.canShare({files: [file]})){
      try{ await navigator.share({files: [file], title: file.name, text: text}); }
      catch(e){ if(e && e.name !== 'AbortError') throw e; }
    } else {
      saveBlob(blob, file.name);
      setToast('PDF baixado. Anexe no WhatsApp pelo clipe.');
    }
  }catch(e){ console.error(e); setToast('Não foi possível gerar o PDF agora. Tente de novo.'); }
  if(btn){ btn.disabled = false; btn.lastChild.textContent = ' Compartilhar PDF'; }
}

async function downloadPdf(s){
  try{ var blob = await buildPdf(s); saveBlob(blob, pdfFileName(s)); setToast('PDF baixado.'); }
  catch(e){ console.error(e); setToast('Não foi possível gerar o PDF agora. Tente de novo.'); }
}

function saveBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function waNumber(n){
  var d = String(n || '').replace(/\D/g, '');
  if(d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}

function summaryText(s){
  var data = sessionRows(s);
  var low = data.rows.filter(function(r){ return r.low; });
  var lines = ['*Contagem ' + ((KIND_LABEL[s.kind] || 'Completa').toLowerCase()) + ' de estoque O Cedro*', (SECTOR_LABEL[s.sector] || s.sector) + ' · ' + formatDateTimeBR(s.createdAt) + (s.responsavel ? ' · ' + s.responsavel : ''), '',
    data.rows.length + ' itens contados' + (data.skipped.length ? ', ' + data.skipped.length + ' não contados' : '') + '.'];
  if(low.length){
    lines.push('', '*No mínimo ou abaixo:*');
    low.forEach(function(r){ lines.push('- ' + r.name + ': ' + fmtQty(r.qty) + ' ' + r.unit + ' (mín ' + fmtQty(r.min) + ')'); });
  }
  lines.push('', 'O PDF completo segue em anexo.');
  return lines.join('\n');
}

function openWhats(num, s){
  var url = 'https://wa.me/' + waNumber(num) + '?text=' + encodeURIComponent(summaryText(s));
  window.open(url, '_blank');
}

async function saveShareNumbers(){
  var inp = document.getElementById('share-nums');
  if(!inp) return;
  var nums = inp.value.split(/[,;\n]/).map(function(x){ return x.trim(); }).filter(function(x){ return waNumber(x).length >= 12; });
  if(!nums.length){ setToast('Coloque pelo menos um número com DDD.'); return; }
  try{
    if(sb) { var r = await sb.from('settings').upsert({key: 'share_numbers', value: nums}); if(r.error) throw r.error; }
    state.shareNumbers = nums; state.modal.editing = false; renderModal(); setToast('Números salvos.');
  }catch(e){ console.error(e); setToast('Não foi possível salvar os números.'); }
}

function modalShare(m){
  var s = m.session;
  if(!m.preparing){
    m.preparing = true;
    buildPdf(s).then(function(b){ m.blob = b; }).catch(function(e){ console.error(e); m.preparing = false; });
  }
  var data = sessionRows(s);
  var lowN = data.rows.filter(function(r){ return r.low; }).length;
  var canShareFiles = !!(navigator.canShare && window.File);
  var nums = state.shareNumbers.map(function(n){
    return '<button class="btn btn-ghost" data-action="share-wa" data-num="'+esc(n)+'">'+ICONS.whats+' Mandar resumo para '+esc(n)+'</button>';
  }).join('');
  var edit = m.editing
    ? '<div class="field" style="margin-top:8px"><label for="share-nums">Números (separe por vírgula)</label><input id="share-nums" type="text" inputmode="tel" value="'+esc(state.shareNumbers.join(', '))+'"></div>' +
      '<button class="btn btn-primary btn-sm" data-action="share-save-nums">Salvar números</button>'
    : (isEquipe() ? '' : '<button class="btn btn-ghost btn-sm share-edit" data-action="share-edit">Editar números</button>');
  return '' +
  '<div class="modal-sheet" data-stop="1">' +
    '<div class="sheet-head"><h2>'+(m.justSaved ? 'Contagem salva' : 'Enviar contagem')+'</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar">'+ICONS.close+'</button></div>' +
    '<div class="share-sum"><span class="kind-tag '+(s.kind==='diaria'?'diaria':'')+'">'+(KIND_LABEL[s.kind]||'Completa')+'</span><b>'+esc(SECTOR_LABEL[s.sector] || s.sector)+'</b> · '+formatDateTimeBR(s.createdAt)+'<br>'+data.rows.length+' itens contados'+(data.skipped.length ? ' · '+data.skipped.length+' não contados' : '')+(lowN ? ' · '+lowN+' no mínimo ou abaixo' : '')+'</div>' +
    '<div class="share-list">' +
      '<button class="btn btn-primary" data-action="share-pdf">'+ICONS.pdf+'<span> Compartilhar PDF</span></button>' +
      (canShareFiles ? '' : '<button class="btn btn-ghost" data-action="share-download">'+ICONS.pdf+' Baixar PDF</button>') +
      nums +
    '</div>' +
    '<p style="font-size:.8rem;color:var(--ink-dim);margin:0 0 6px">No celular, "Compartilhar PDF" abre a lista de apps: escolha o WhatsApp e o contato. Os botões de resumo abrem a conversa já com o texto da contagem.</p>' +
    edit +
  '</div>';
}


// ================= LISTA DIÁRIA =================
function dailyOpen(){
  var sector = state.sector;
  var sel = {};
  sectorItems(sector).forEach(function(it){ sel[it.id] = !!it.daily; });
  state.modal = {type:'daily', sector: sector, sel: sel};
  renderModal();
}
function dailyCount(){
  var m = state.modal; if(!m) return 0;
  return Object.keys(m.sel).filter(function(k){ return m.sel[k]; }).length;
}
function dailyToggleCat(cat){
  var m = state.modal; if(!m) return;
  var ids = sectorItems(m.sector).filter(function(it){ return (it.category || 'Outros') === cat; }).map(function(it){ return it.id; });
  var allOn = ids.every(function(id){ return m.sel[id]; });
  ids.forEach(function(id){ m.sel[id] = !allOn; });
  var sc = document.getElementById('daily-scroll'); var top = sc ? sc.scrollTop : 0;
  renderModal();
  var sc2 = document.getElementById('daily-scroll'); if(sc2) sc2.scrollTop = top;
}
function modalDaily(m){
  var g = groupBy(sectorItems(m.sector), function(it){ return it.category || 'Outros'; });
  var body = g.order.map(function(cat){
    var list = g.groups[cat];
    var allOn = list.every(function(it){ return m.sel[it.id]; });
    return '<div class="daily-cat"><div class="daily-cat-head"><b>'+esc(cat)+'</b>' +
      '<button class="link-btn" data-action="daily-cat" data-cat="'+esc(cat)+'">'+(allOn ? 'Desmarcar todos' : 'Marcar todos')+'</button></div>' +
      list.map(function(it){
        return '<label class="daily-opt"><input type="checkbox" data-daily-id="'+it.id+'"'+(m.sel[it.id]?' checked':'')+'>'+esc(it.product)+'</label>';
      }).join('') + '</div>';
  }).join('');
  return '' +
  '<div class="modal-sheet sheet-full" data-stop="1">' +
    '<div class="sheet-head"><h2>Lista diária · '+esc(SECTOR_LABEL[m.sector])+'</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar">'+ICONS.close+'</button></div>' +
    '<p class="section-intro">Marque o que é contado todo dia. A contagem completa continua com todos os itens do setor.</p>' +
    '<div class="sheet-scroll" id="daily-scroll">'+body+'</div>' +
    '<div class="modal-actions" style="margin-top:12px;align-items:center">' +
      '<span style="margin-right:auto;font-size:.84rem;color:var(--ink-dim)"><b id="daily-count">'+dailyCount()+'</b> marcados</span>' +
      '<button class="btn btn-ghost" data-action="close-modal">Cancelar</button>' +
      '<button class="btn btn-primary" data-action="daily-save">Salvar lista</button>' +
    '</div>' +
  '</div>';
}
async function dailySave(){
  var m = state.modal; if(!m) return;
  var on = [], off = [];
  sectorItems(m.sector).forEach(function(it){
    var want = !!m.sel[it.id];
    if(want !== !!it.daily) (want ? on : off).push(it.id);
  });
  try{
    if(sb){
      if(on.length){ var r1 = await sb.from('items').update({daily: true}).in('id', on); if(r1.error) throw r1.error; }
      if(off.length){ var r2 = await sb.from('items').update({daily: false}).in('id', off); if(r2.error) throw r2.error; }
    }
    on.forEach(function(id){ if(state.items[id]) state.items[id].daily = true; });
    off.forEach(function(id){ if(state.items[id]) state.items[id].daily = false; });
    state.modal = null; render(); renderModal();
    setToast('Lista diária salva: ' + sectorItems(m.sector).filter(function(it){ return it.daily; }).length + ' itens.');
    scheduleReload('items');
  }catch(e){ console.error(e); setToast('Não foi possível salvar a lista. Tente de novo.'); }
}

// ================= ITENS DO SETOR =================
// Cada item é contado em um setor só. Aqui a gerência escolhe, de qualquer setor, os itens que este setor conta.
function secItemsOpen(){
  var sector = state.sector, sel = {};
  itemsArray().forEach(function(it){ sel[it.id] = it.sector === sector; });
  var back = sector === 'Cozinha' ? 'Bar' : 'Cozinha';
  state.modal = {type:'secitems', sector: sector, sel: sel, back: back, q: ''};
  renderModal();
}
function secItemsCount(){ var m = state.modal; return Object.keys(m.sel).filter(function(k){ return m.sel[k]; }).length; }
function secItemsGroups(m){
  var all = itemsArray().slice().sort(function(a, b){
    var sa = a.sector === m.sector ? -1 : SEED.sectors.indexOf(a.sector), sb2 = b.sector === m.sector ? -1 : SEED.sectors.indexOf(b.sector);
    if(sa !== sb2) return sa - sb2;
    if((a.category||'') !== (b.category||'')) return (a.category||'').localeCompare(b.category||'', 'pt-BR');
    return (a.product||'').localeCompare(b.product||'', 'pt-BR');
  });
  return groupBy(all, function(it){ return it.sector + '||' + (it.category || 'Outros'); });
}
function modalSecItems(m){
  var g = secItemsGroups(m);
  var body = g.order.map(function(k){
    var parts = k.split('||'), from = parts[0], cat = parts[1], list = g.groups[k];
    var allOn = list.every(function(it){ return m.sel[it.id]; });
    return '<div class="daily-cat" data-sec-group="1"><div class="daily-cat-head"><b>'+esc(cat)+' <span class="sec-from">· '+(from === m.sector ? 'já neste setor' : 'hoje em '+esc(SECTOR_LABEL[from]||from))+'</span></b>' +
      '<button class="link-btn" data-action="secitems-cat" data-key="'+esc(k)+'">'+(allOn ? 'Desmarcar todos' : 'Marcar todos')+'</button></div>' +
      list.map(function(it){
        return '<label class="daily-opt" data-name="'+esc((it.product||'').toLowerCase())+'"><input type="checkbox" data-sec-id="'+it.id+'"'+(m.sel[it.id]?' checked':'')+'>'+esc(it.product)+'</label>';
      }).join('') + '</div>';
  }).join('');
  var others = SEED.sectors.filter(function(s){ return s !== m.sector; });
  return '' +
  '<div class="modal-sheet sheet-full" data-stop="1">' +
    '<div class="sheet-head"><h2>Itens do setor · '+esc(SECTOR_LABEL[m.sector]||m.sector)+'</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar">'+ICONS.close+'</button></div>' +
    '<p class="section-intro">Marque o que é contado em '+esc(SECTOR_LABEL[m.sector]||m.sector)+'. Cada item fica em um setor só: ao marcar, ele sai do setor onde estava. A categoria continua a mesma.</p>' +
    '<div class="search-wrap sec-search">'+ICONS.search+'<input type="text" id="sec-search" placeholder="Buscar produto..." value="'+esc(m.q)+'"></div>' +
    '<div class="sheet-scroll" id="sec-scroll">'+body+'</div>' +
    '<div class="sec-foot">Itens desmarcados daqui vão para <select id="sec-back">'+others.map(function(s){ return '<option value="'+s+'"'+(s===m.back?' selected':'')+'>'+esc(SECTOR_LABEL[s]||s)+'</option>'; }).join('')+'</select></div>' +
    '<div class="modal-actions" style="margin-top:12px;align-items:center">' +
      '<span style="margin-right:auto;font-size:.84rem;color:var(--ink-dim)"><b id="sec-count">'+secItemsCount()+'</b> itens</span>' +
      '<button class="btn btn-ghost" data-action="close-modal">Cancelar</button>' +
      '<button class="btn btn-primary" data-action="secitems-save">Salvar</button>' +
    '</div>' +
  '</div>';
}
function secItemsFilter(){
  var m = state.modal; if(!m) return;
  var q = (m.q || '').trim().toLowerCase();
  document.querySelectorAll('#sec-scroll [data-sec-group]').forEach(function(gEl){
    var any = false;
    gEl.querySelectorAll('.daily-opt').forEach(function(o){ var show = !q || o.getAttribute('data-name').indexOf(q) !== -1; o.style.display = show ? '' : 'none'; if(show) any = true; });
    gEl.style.display = any ? '' : 'none';
  });
}
function secItemsToggleCat(key){
  var m = state.modal; if(!m) return;
  var ids = itemsArray().filter(function(it){ return it.sector + '||' + (it.category || 'Outros') === key; }).map(function(it){ return it.id; });
  var allOn = ids.every(function(id){ return m.sel[id]; });
  ids.forEach(function(id){ m.sel[id] = !allOn; });
  var sc = document.getElementById('sec-scroll'); var top = sc ? sc.scrollTop : 0;
  renderModal(); secItemsFilter();
  var sc2 = document.getElementById('sec-scroll'); if(sc2) sc2.scrollTop = top;
}
async function secItemsSave(){
  var m = state.modal; if(!m) return;
  var bs = document.getElementById('sec-back'); if(bs) m.back = bs.value;
  var into = [], out = [];
  itemsArray().forEach(function(it){
    var want = !!m.sel[it.id];
    if(want && it.sector !== m.sector) into.push(it.id);
    if(!want && it.sector === m.sector) out.push(it.id);
  });
  if(!into.length && !out.length){ closeModal(); return; }
  var btn = document.querySelector('[data-action="secitems-save"]'); if(btn){ btn.disabled = true; btn.textContent = 'Salvando...'; }
  try{
    if(sb){
      if(into.length){ var r1 = await sb.from('items').update({sector: m.sector}).in('id', into); if(r1.error) throw r1.error; }
      if(out.length){ var r2 = await sb.from('items').update({sector: m.back}).in('id', out); if(r2.error) throw r2.error; }
    }
    into.forEach(function(id){ if(state.items[id]) state.items[id].sector = m.sector; });
    out.forEach(function(id){ if(state.items[id]) state.items[id].sector = m.back; });
    state.modal = null; render(); renderModal();
    setToast(SECTOR_LABEL[m.sector] + ': ' + itemsArray().filter(function(it){ return it.sector === m.sector; }).length + ' itens' + (out.length ? ' · ' + out.length + ' foram para ' + SECTOR_LABEL[m.back] : '') + '.');
    scheduleReload('items');
  }catch(e){
    console.error(e);
    if(btn){ btn.disabled = false; btn.textContent = 'Salvar'; }
    setToast('Não foi possível salvar. Tente de novo.');
  }
}

// ================= MODALS =================
function renderModal(){
  var root = document.getElementById('modal-root');
  if(!state.modal){ root.innerHTML=''; root.removeAttribute('data-type'); return; }
  var html = '';
  if(state.modal.type === 'note') html = modalNote(state.modal);
  else if(state.modal.type === 'item-form') html = modalItemForm(state.modal);
  else if(state.modal.type === 'supplier-form') html = modalSupplierForm(state.modal);
  else if(state.modal.type === 'confirm-delete') html = modalConfirmDelete(state.modal);
  else if(state.modal.type === 'guided') html = modalGuided(state.modal);
  else if(state.modal.type === 'scan') html = modalScan(state.modal);
  else if(state.modal.type === 'route') html = modalRoute(state.modal);
  else if(state.modal.type === 'finalize-check') html = modalFinalizeCheck(state.modal);
  else if(state.modal.type === 'share') html = modalShare(state.modal);
  else if(state.modal.type === 'daily') html = modalDaily(state.modal);
  else if(state.modal.type === 'extra-req') html = modalExtraReq(state.modal);
  else if(state.modal.type === 'extra-del') html = modalExtraDel(state.modal);
  else if(state.modal.type === 'posto-pass') html = modalPostoPass(state.modal);
  else if(state.modal.type === 'secitems') html = modalSecItems(state.modal);
  var bd = root.firstElementChild;
  if(bd && bd.classList.contains('modal-backdrop') && root.getAttribute('data-type') === state.modal.type){ bd.innerHTML = html; }
  else { root.innerHTML = '<div class="modal-backdrop" data-action="close-modal">'+html+'</div>'; }
  root.setAttribute('data-type', state.modal.type);
}

async function saveExtraReq(form){
  var fd = new FormData(form);

async function setExtraStatus(id, done){
  var data = done ? {status:'comprado', comprado_em: new Date().toISOString(), comprado_por: state.responsavel || null}

    state.extras.forEach(function(x){ if(x.id === id) Object.assign(x, data); });

async function deleteExtra(id){
  try{

    state.extras = state.extras.filter(function(x){ return x.id !== id; });

}

// ================= CLOSE / SHARED =================
function closeModal(){
  var m = state.modal;
  if(m && m.type === 'scan'){ stopCamera(); state.modal = m.prev || null; }
  else state.modal = null;
  render(); renderModal();
  if(state.modal && state.modal.type === 'guided') focusGuided();
}

// ================= GUIDED COUNT =================
function guidedStart(remainingOnly){
  var sector = state.sector;
  var d = draftOf(sector);
  var list = countItems(sector);
  var ids = (remainingOnly ? list.filter(function(it){ return !isFilled(d[it.id]); }) : list).map(function(it){ return it.id; });
  if(!ids.length){ setToast(remainingOnly ? 'Não falta nenhum item neste setor.' : 'Este setor ainda não tem itens.'); return; }
  var start = 0;
  if(!remainingOnly){
    for(var k=0;k<ids.length;k++){ if(!isFilled(d[ids[k]])){ start = k; break; } }
  }
  state.modal = {type:'guided', sector: sector, ids: ids, i: start};
  renderModal(); focusGuided();
}

function focusGuided(){
  if(!finePointer()) return;
  setTimeout(function(){ var g = document.getElementById('g-input'); if(g){ g.focus({preventScroll:true}); g.select(); } }, 30);
}

function guidedItem(){ var m = state.modal; return m ? state.items[m.ids[m.i]] : null; }

function modalGuided(m){
  var it = state.items[m.ids[m.i]];
  if(!it){ return '<div class="modal-sheet" data-stop="1"><p>Item não encontrado.</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Fechar</button></div></div>'; }
  var d = draftOf(m.sector);
  var raw = d[it.id];
  var nc = isNC(raw);
  var val = (!nc && isFilled(raw)) ? String(raw) : '';
  var last = (it.currentCount === null || it.currentCount === undefined) ? '' : fmtQty(it.currentCount);
  var done = m.ids.filter(function(id){ return isFilled(d[id]); }).length;
  var pct = Math.round(done / m.ids.length * 100);
  var low = !nc && val !== '' && isLow(Object.assign({}, it, {currentCount: num(val)}));
  var isLast = m.i === m.ids.length - 1;
  var nextIt = isLast ? null : state.items[m.ids[m.i+1]];
  var input = nc
    ? '<div class="g-nc">Marcado como não contado.<br><span style="font-weight:500;font-size:.85rem">O estoque dele fica como estava.</span></div>'
    : '<div class="g-stepper">' +
        '<button data-action="g-step" data-dir="-1" aria-label="Diminuir">−</button>' +
        '<input id="g-input" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="'+esc(val)+'" placeholder="0" aria-label="Quantidade contada">' +
        '<button data-action="g-step" data-dir="1" aria-label="Aumentar">+</button>' +
      '</div>' +
      '<div class="g-hint">'+(last ? 'Última contagem: '+esc(last)+' '+esc(it.unit||'') : 'Ainda sem contagem anterior')+'</div>' +
      '<div class="g-low" id="g-low"'+(low?'':' hidden')+'>Abaixo do mínimo: vai para a lista de pedidos.</div>';
  return '' +
  '<div class="modal-sheet sheet-full" data-stop="1">' +
    '<div class="g-top">' +
      '<button class="icon-btn" data-action="close-modal" aria-label="Sair da contagem guiada">'+ICONS.close+'</button>' +
      '<div class="g-progress"><div class="g-bar"><span style="width:'+pct+'%"></span></div>' +
        '<div class="g-count mono">'+(m.i+1)+' de '+m.ids.length+' · '+done+' feitos</div></div>' +
      '<button class="icon-btn" data-action="scan-open" aria-label="Ler código de barras">'+ICONS.scan+'</button>' +
    '</div>' +
    '<div class="g-body">' +
      '<div class="g-place">'+esc(it.category)+'</div>' +
      '<h2 class="g-name">'+esc(it.product)+'</h2>' +
      '<div class="item-sub"><span class="tag">'+esc(it.unit||'')+'</span>' +
        (it.minStock!==null&&it.minStock!==undefined ? '<span class="tag">mín '+fmtQty(it.minStock)+'</span>' : '') +
        (it.notes ? '<span class="tag">'+esc(it.notes)+'</span>' : '') +
      '</div>' +
      input +
    '</div>' +
    '<div class="g-actions">' +
      '<button class="btn btn-ghost" data-action="g-prev"'+(m.i===0?' disabled':'')+'>'+ICONS.left+' Voltar</button>' +
      '<button class="btn '+(nc?'btn-danger':'btn-ghost')+'" data-action="g-nc">'+(nc?'Desfazer':'Não contado')+'</button>' +
      '<button class="btn btn-accent" data-action="g-next">'+(isLast?'Concluir':'Próximo')+' '+ICONS.right+'</button>' +
    '</div>' +
    (nextIt ? '<div class="g-next-hint">Depois: '+esc(nextIt.product)+'</div>' : '<div class="g-next-hint">Último item da rota</div>') +
  '</div>';
}

function guidedRefresh(){ render(); renderModal(); focusGuided(); }

function guidedInput(v){
  var m = state.modal, it = guidedItem(); if(!it) return;
  draftOf(m.sector)[it.id] = v;
  var low = v !== '' && isLow(Object.assign({}, it, {currentCount: num(v)}));
  var lw = document.getElementById('g-low'); if(lw) lw.hidden = !low;
}

function guidedStep(dir){
  var m = state.modal, it = guidedItem(); if(!it) return;
  var d = draftOf(m.sector);
  var cur = (isFilled(d[it.id]) && !isNC(d[it.id])) ? (num(d[it.id]) || 0) : ((it.currentCount != null) ? it.currentCount : 0);
  var n = cur + dir; if(n < 0) n = 0;
  d[it.id] = String(Math.round(n*100)/100);
  guidedRefresh();
}

function guidedMove(delta){
  var m = state.modal; if(!m) return;
  m.i += delta;
  if(m.i < 0) m.i = 0;
  if(m.i >= m.ids.length){
    state.modal = null; render(); renderModal();
    var left = sectorBlankItems(state.sector).length;
    setToast(left ? 'Fim da rota. Ainda há '+left+' em branco.' : 'Fim da rota. Confira e toque em Finalizar.');
    return;
  }
  guidedRefresh();
}

function guidedToggleNC(){
  var m = state.modal, it = guidedItem(); if(!it) return;
  var d = draftOf(m.sector);
  if(isNC(d[it.id])){ delete d[it.id]; guidedRefresh(); }
  else { d[it.id] = NC; guidedMove(1); }
}
